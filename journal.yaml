    delete:
      tags: [admin-access]
      operationId: revokeAdminHeadStudentGrant
      summary: Revoke a head-student grant binding
      description: |
        Soft-revokes the grant by setting `head_student_grants.revoked_at = NOW()`.
        Creates an `ACCESS_BINDING_REVOKED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: grant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Head-student grant revoked
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{user_id}:
    get:
      tags: [admin-users]
      operationId: getAdminUser
      summary: Get a local user profile
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Local user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
