            schema:
              $ref: '#/components/schemas/RequestReportRequest'
      responses:
        "202":
          description: Report generation task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /current-attestation/prefill:
    get:
      tags: [reports]
      operationId: getCurrentAttestationPrefill
      summary: Get prefill data for current attestation statement creation
      description: |
        Returns the journal context, default editable display values, default options,
