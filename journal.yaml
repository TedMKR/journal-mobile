        is_visible:
          type: boolean
          description: Set false to hide the download action from public clients.
        download_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: Required when `is_visible=true`; must be an absolute http/https URL.

    # -- Application Backups -----------------------------------------------
    BackupCapability:
      type: object
