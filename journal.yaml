            format: uuid
        - name: discipline_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: academic_period_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: teacher_id
          in: query
          required: false
          description: Internal teacher profile UUID; required for admin/methodologist, optional for teacher.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prefill data for current attestation statement form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAttestationPrefill'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /reports/{job_id}/status:
