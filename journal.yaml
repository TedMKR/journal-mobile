              type: integer

    AdminJournalActionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: |
            Причина изменения статуса журнала (обязательно).
            Для `lock`/`unlock` — причина заморозки или её снятия.
            Для `archive`/`restore` — причина архивирования или восстановления из архива.
            См. examples в конкретной операции.
          example: Административное действие — указать причину

    AdminPeriodListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AcademicPeriod'

    AdminPeriodCreateRequest:
      type: object
      required: [name, starts_at, ends_at]
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable period name; whitespace-only values are rejected.
        starts_at:
          type: string
          format: date-time
          description: Period start timestamp.
        ends_at:
          type: string
          format: date-time
          description: Period end timestamp; must be greater than or equal to starts_at.
        is_closed:
          type: boolean
          default: false
          description: Whether the period starts in closed/read-only state.

    AdminPeriodUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          description: New human-readable period name; whitespace-only values are rejected.
        starts_at:
          type: string
          format: date-time
          description: New period start timestamp.
        ends_at:
          type: string
          format: date-time
          description: New period end timestamp.

    AdminPeriodDeleteRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Required non-blank reason for deleting an unused academic period.

    AdminPeriodActionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Required non-blank reason for closing or reopening an academic period; whitespace-only values are rejected.
        reopen_until:
          type: string
          format: date-time
          nullable: true
          description: Optional late-entry window marker recorded in audit context.

    AuditEvent:
      type: object
      required: [id, event_type, actor_id, actor_role, entity_type, entity_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [JOURNAL_LOCKED, JOURNAL_UNLOCKED, JOURNAL_ARCHIVED, JOURNAL_RESTORED, JOURNAL_EXPORTED, USER_PROFILE_UPDATED, USER_BLOCKED, USER_UNBLOCKED, PERIOD_CLOSED, PERIOD_REOPENED, AUDIT_EXPORTED]
          description: Type of the administrative event
        actor_id:
          type: string
          format: uuid
          description: UUID of the user who performed the action
        actor_role:
          type: string
          description: Role of the actor at the time of the action
        entity_type:
          type: string
          example: JournalContext
        entity_id:
          type: string
          format: uuid
          description: UUID of the affected entity
        before_state:
          type: string
          nullable: true
          description: Base64-encoded JSON snapshot of the entity before the change
        after_state:
          type: string
          nullable: true
          description: Base64-encoded JSON snapshot of the entity after the change
        context:
          type: string
          nullable: true
          description: Base64-encoded JSON with additional context (e.g. `{"reason":"..."}`)
        request_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    AuditEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        meta:
          type: object
          required: [total, page, page_size]
          properties:
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer

    BackupArtifact:
      type: object
      required: [id, component, status, file_name, size_bytes, created_at, actions]
      properties:
        id:
          type: string
          example: db_20260520T120000Z
        component:
          type: string
          enum: [database]
        status:
          type: string
          enum: [created, failed]
        file_name:
          type: string
          example: db_20260520T120000Z.dump
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        checked_at:
          type: string
          format: date-time
          nullable: true
        check_status:
          type: string
          enum: [passed, failed]
          nullable: true
        error_message:
          type: string
          nullable: true
        actions:
          type: array
          description: Per-artifact button/action model for frontend and mobile clients.
          items:
            $ref: '#/components/schemas/BackupAction'

    BackupListResponse:
      type: object
      required: [capabilities, artifacts, meta]
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/BackupCapability'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/BackupArtifact'
        meta:
          type: object
          required: [total, backup_dir]
          properties:
            total:
              type: integer
            backup_dir:
              type: string
            storage_hint:
              type: string
              nullable: true
              example: Docker volume backup_data смонтирован в Domain по пути /app/backups

    AdminDashboardSummary:
      type: object
      required: [generated_at, users, journals, documents, backups, imports]
      properties:
        generated_at:
          type: string
          format: date-time
        users:
          $ref: '#/components/schemas/AdminDashboardUsersSummary'
        journals:
          $ref: '#/components/schemas/AdminDashboardJournalsSummary'
        documents:
          $ref: '#/components/schemas/AdminDashboardDocumentsSummary'
        backups:
          $ref: '#/components/schemas/AdminDashboardBackupsSummary'
        imports:
          $ref: '#/components/schemas/AdminDashboardImportsSummary'

    AdminDashboardUsersSummary:
      type: object
      required: [total, active, blocked, teachers, students]
      properties:
        total:
          type: integer
        active:
          type: integer
        blocked:
          type: integer
        teachers:
          type: integer
        students:
          type: integer

    AdminDashboardJournalsSummary:
      type: object
      required: [total, active, locked, archived]
      properties:
        total:
          type: integer
        active:
          type: integer
        locked:
          type: integer
        archived:
          type: integer

    AdminDashboardDocumentsSummary:
      type: object
      required: [total, pending, running, done, failed, permanently_failed]
      properties:
        total:
          type: integer
        pending:
          type: integer
        running:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        permanently_failed:
          type: integer
        latest_created_at:
          type: string
          format: date-time
          nullable: true

    AdminDashboardBackupsSummary:
      type: object
      required: [status, artifacts]
      properties:
        status:
          type: string
          enum: [enabled, error]
          description: Backup subsystem status as seen by Domain.
        artifacts:
          type: integer
          description: Number of known backup artifacts.
        latest_id:
          type: string
          nullable: true
        latest_status:
          type: string
          nullable: true
        latest_created_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true

    AdminDashboardImportsSummary:
      type: object
      required:
        - total
        - pending
        - validating
        - preview_ready
        - conflicts_detected
        - resolved
        - applying
        - completed
        - failed
        - partial
        - cancelled
        - errors_total
      properties:
        total:
          type: integer
        pending:
          type: integer
        validating:
          type: integer
        preview_ready:
          type: integer
        conflicts_detected:
          type: integer
        resolved:
          type: integer
        applying:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        partial:
          type: integer
        cancelled:
          type: integer
        errors_total:
          type: integer
          description: Number of persisted row-level import errors.
        latest_status:
          type: string
          enum: [pending, validating, preview_ready, conflicts_detected, resolved, applying, completed, failed, partial, cancelled]
          nullable: true
        latest_started_at:
          type: string
          format: date-time
          nullable: true

    CreateBackupRequest:
      type: object
      properties:
        component:
          type: string
          enum: [database]
          default: database
          description: Only `database` is currently supported by the application API.

    # -- Academic Periods ---------------------------------------------------
    AcademicPeriod:
      type: object
      required: [id, name, starts_at, ends_at, is_closed, is_active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Human-readable period name (e.g. "Осенний семестр 2024-2025")
          example: "Осенний семестр 2024-2025"
        starts_at:
          type: string
          format: date-time
          description: Period start timestamp. Runtime serializes PostgreSQL DATE as RFC3339 midnight UTC.
        ends_at:
          type: string
          format: date-time
          description: Period end timestamp. Runtime serializes PostgreSQL DATE as RFC3339 midnight UTC.
        is_closed:
          type: boolean
          description: Closed periods cannot be edited (attendance / grades are locked)
        is_active:
          type: boolean
          description: True if this is the currently active period

    # -- Methodologist Catalogs ---------------------------------------------
    ListMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Discipline:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
