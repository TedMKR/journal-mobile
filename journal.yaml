openapi: 3.0.3
info:
  title: University Journal System API
  description: |
    REST API for the University Electronic Journal System.
    Handles attendance tracking, grade management, assessment forms, and reporting.

    ## Architecture

    The system has two HTTP services:

    | Service | Port | Purpose |
    |---|---|---|
    | **Edge service** | `:8080` | Public API (`/api/v1/...`). Validates JWT (or debug auth), enforces RBAC, proxies to Domain. |
    | **Domain service** | `:8081` | Internal API (`/internal/v1/...`). No auth middleware. Reachable only inside the Docker network. |

    **Always call Edge on `:8080`.** Direct calls to Domain (`:8081`) bypass authentication and use a different path prefix.

    ## Authentication

    ### Public endpoints (no Bearer token)

    - `GET /health`, `GET /ready`, `GET /metrics` — on the Edge root (not under `/api/v1`)
    - `GET /api/v1/mobile/app-download` — public mobile APK link
    - `GET /api/openapi.yaml`, `GET /api/docs` — when API docs are enabled (`API_DOCS_ENABLED=true`, or default in non-prod)

    All other `/api/v1/*` routes require authentication.

    ### Production / external Keycloak

    Clients obtain an OIDC access token via Authorization Code + PKCE (`journal-web`, `journal-mobile`).
    Edge validates the JWT against the configured realm; `journal-backend` is the API audience/client used for validation, not a user login client.

    ```http
    Authorization: Bearer <access_token>
    ```

    Token issuer and realm come from environment variables `KEYCLOAK_URL` and `KEYCLOAK_REALM`
    (for example an external `https://sso.example.edu/realms/Test`).

    ### Local prod-local stack (`DEBUG_BYPASS_AUTH=true`)

    When the stack runs with debug auth enabled, JWT verification is skipped. Send the role explicitly:

    ```http
    X-Debug-Role: teacher
    ```

    Allowed values: `teacher`, `student`, `admin`, `methodologist`.
    This mode is for local/integration testing only and is blocked when `APP_ENV=prod`.

    ## API exploration

    | URL | Purpose |
    |---|---|
    | `http://localhost:8080/api/docs` | Swagger UI (Edge direct) |
    | `http://localhost:8080/api/openapi.yaml` | OpenAPI spec for Postman / codegen |
    | `http://localhost/api/docs` | Same via Nginx when the full compose stack publishes port 80 |

    **Postman:** import from `http://localhost:8080/api/openapi.yaml` (or the Nginx URL above).
    Set server/base URL to `http://localhost:8080/api/v1`. With debug auth, add header `X-Debug-Role`; with Keycloak, use `Authorization: Bearer <token>`.
  version: 1.0.0
  contact:
    name: University Journal System

servers:
  # All versioned API paths live under /api/v1 on the Edge service (:8080).
  # The Edge service handles authentication (JWT) and proxies to Domain service (:8081).
  # IMPORTANT: never call the Domain service directly - it has no auth middleware.
  - url: /api/v1
    description: Current origin - Edge service (recommended for Swagger UI)
  - url: http://localhost:8080/api/v1
    description: Local development - Edge direct (Bearer JWT or X-Debug-Role when DEBUG_BYPASS_AUTH=true)
  - url: http://domain:8081/internal/v1
    description: Docker-internal - Domain service direct (no auth; paths differ from public Edge API)

tags:
  - name: schedule
    description: Teacher schedule and lesson listings
  - name: periods
    description: Academic periods (semesters)
  - name: groups
    description: Academic groups and student rosters
  - name: catalogs
    description: Read-only dictionaries for methodologist/admin setup screens
  - name: attendance
    description: Student attendance tracking
  - name: grades
    description: Grade records and assessment forms
  - name: journal
    description: Aggregated teacher journal grid read models
  - name: reports
    description: Asynchronous report generation
  - name: student
    description: Student personal schedule, subject cards and progress tracking
  - name: dashboard
    description: Teacher dashboard aggregates (stats, attendance summary, group performance)
  - name: archive
    description: |
      Archive of journals from closed academic periods, and record-level archive/restore operations.

      ## Journal archive list
      `GET /journals/archive` - paginated list of (discipline x group x period) entries for closed periods.

      ## Record-level archive / restore
      Individual `AttendanceRecord` and `GradeRecord` entries can be soft-deleted (archived) and
      subsequently restored without physical deletion.

      - `POST /attendance-records/{id}/archive` - archive an attendance record
      - `POST /attendance-records/{id}/restore` - restore an archived attendance record
      - `POST /grades/{id}/archive` - archive a grade record
      - `POST /grades/{id}/restore` - restore an archived grade record

      Archived records are excluded from all operational views by default.
      Pass `include_archived=true` on `GET /lessons/{id}/attendance` or
      `GET /assessment-forms/{id}/grades` to include them (teacher/admin only;
      students never see archived records).

      **409 Conflict** is returned when attempting to archive an already-archived record
      or restore a non-archived record.
  - name: health
    description: Service health and readiness probes
  - name: app-download
    description: Public mobile application download link and admin settings
  - name: backups
    description: Admin backup and restore-check operations for the application scope only
  - name: admin-dashboard
    description: |
      Admin dashboard summary for the application health overview.

      Combines read-only counters from users, journals, documents, backups and
      import diagnostics for the admin home page.

      **Roles:** `admin`.
  - name: grants
    description: Teacher-to-teacher journal access delegation (read or write access sharing)
  - name: lesson-templates
    description: КТП (calendar-thematic plan) templates - plan authoring, topic management, and assignment to teaching contexts
  - name: admin-journals
    description: |
      Admin journal context lifecycle management.

      Each journal context (`teacher + discipline + group + period + lesson_type`)
      has a status:

      - `active` — журнал открыт, запись разрешена
      - `locked` — **заморозка** (временная блокировка записи; снимается через unlock)
      - `archived` — **архивирование** (журнал закрыт для редактирования; возврат через restore)

      **Заморозка (lock / unlock):** `active ↔ locked` — временно запретить правки
      (аттестация, проверка), затем вернуть в работу.

      **Архивирование (archive / restore):** `active → archived → active` — закрыть
      журнал по завершении периода или административному решению; restore возвращает
      журнал в рабочее состояние (не путать с unlock).

      All state-changing actions require a `reason` and create an audit event.

      **Roles:** `admin`.
  - name: admin-audit
    description: |
      Admin audit log — read-only view of all significant administrative events.

      Events include `JOURNAL_LOCKED`, `JOURNAL_UNLOCKED`, `JOURNAL_ARCHIVED`,
      `JOURNAL_RESTORED`. Each event captures `before_state`, `after_state`
      (base64-encoded JSON snapshots) and `context` (JSON with `reason`).

      **Roles:** `admin`.
  - name: admin-users
    description: |
      Local backend user profile administration.

      Authentication and base roles may come from external IAM/Keycloak, but
      the application still owns local profile state: student/teacher display
      names, profile sync locking and application-level block/unblock.

      **Roles:** `admin`.
  - name: admin-periods
    description: |
      Admin academic period lifecycle management.

      Closing a period sets `academic_periods.is_closed=true`; attendance,
      assessment form and grade writes are rejected by the existing
      `PERIOD_CLOSED` write guard. Reopening a period is a controlled
      late-entry operation and must include a reason.

      Period close/reopen does not change journal context statuses
      (`active`, `locked`, `archived`).

      **Roles:** `admin`.
  - name: admin-access
    description: |
      Admin subject access binding management.

      MVP uses `journal_access_grants` for teacher-to-teacher journal
      delegation. Creating a binding verifies that the selected granter owns
      an active source journal context or teaching assignment for the requested
      group, discipline and optional period.

      **Roles:** `admin`.
  - name: admin-documents
    description: |
      Admin document operations over the existing reports/document task contour.

      MVP exposes current attestation statement creation, document task list/detail,
      generated file download and statement template discovery.

      **Roles:** `admin`.
  - name: admin-imports
    description: |
      Student import lifecycle.

      Clients parse Excel/CSV themselves and submit a JSON list of student rows.
      The server is **format-agnostic** - it only processes JSON.

      **Lifecycle:** `submit -> preview -> resolve conflicts -> apply`

      **Roles:** `admin`, `methodologist`.

paths:
  # -- Health -------------------------------------------------------------
  # Health probes are infrastructure endpoints - they live at the root path,
  # NOT under /api/v1. The path-level `servers` override below corrects the
  # base URL for these two paths only; all other paths use the global server.
  /health:
    servers:
      - url: http://localhost:8080
        description: Edge service root (health probes are not versioned)
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns `{"status":"ok"}` when the process is running.
        Registered at `GET /health` (no `/api/v1/` prefix).
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    servers:
      - url: http://localhost:8080
        description: Edge service root (health probes are not versioned)
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns `{"status":"ready"}` when PostgreSQL is reachable and migrations are applied.
        Returns `503` when the database is unavailable.
        Registered at `GET /ready` (no `/api/v1/` prefix).
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # -- Mobile App Download -------------------------------------------------
  /mobile/app-download:
    get:
      tags: [app-download]
      operationId: getMobileAppDownload
      summary: Get public mobile app download link
      description: |
        Public endpoint for frontend/mobile landing screens. Does not require
        authentication. Returns `is_visible=false` and `download_url=null` when
        the APK download should be hidden.
      security: []
      responses:
        "200":
          description: Current public mobile app download state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppDownloadResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/mobile/app-download:
    put:
      tags: [app-download]
      operationId: updateMobileAppDownload
      summary: Update mobile app download link
      description: |
        Updates the public APK download URL and visibility flag.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMobileAppDownloadRequest'
      responses:
        "200":
          description: Updated mobile app download settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppDownloadResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Application Backups -------------------------------------------------
  /admin/backups:
    get:
      tags: [backups]
      operationId: listBackups
      summary: List backup capabilities and artifacts
      description: |
        Admin-only backup dashboard endpoint for frontend/mobile.

        Scope is intentionally limited to this application data and application
        runtime artifacts configured in this API.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Backup capabilities and known artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [backups]
      operationId: createBackup
      summary: Create a backup artifact
      description: |
        Creates a backup artifact synchronously.

        First implementation supports only `component=database`, which creates
        a PostgreSQL custom-format dump (`pg_dump -Fc`) of the application DB.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupRequest'
      responses:
        "201":
          description: Backup artifact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupArtifact'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/backups/{artifact_id}:
    get:
      tags: [backups]
      operationId: getBackup
      summary: Get backup artifact metadata
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
          example: db_20260520T120000Z
      responses:
        "200":
          description: Backup artifact metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupArtifact'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/backups/{artifact_id}/file:
    get:
      tags: [backups]
      operationId: downloadBackupFile
      summary: Download backup artifact file
      description: |
        Downloads the backup artifact binary. Intended for administrators, not
        normal mobile users.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Backup dump file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/backups/{artifact_id}/restore-check:
    post:
      tags: [backups]
      operationId: checkBackupRestore
      summary: Validate backup artifact restore metadata
      description: |
        Runs a lightweight restore-check for a database dump using
        `pg_restore --list`. This verifies that the custom-format dump is
        readable and contains restorable entries; it does not overwrite the
        running application database.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restore-check passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupArtifact'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Restore-check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupArtifact'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Admin Dashboard ------------------------------------------------------
  /admin/dashboard-summary:
    get:
      tags: [admin-dashboard]
      operationId: getAdminDashboardSummary
      summary: Get admin dashboard summary
      description: |
        Returns read-only counters for the admin home page:
        local users, journal statuses, document tasks, backup status and import
        diagnostics. This endpoint does not mutate data and does not grant admin
        write access to journal attendance or grades.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Admin Journals -------------------------------------------------------
  /admin/journals:
    get:
      tags: [admin-journals]
      operationId: listAdminJournals
      summary: List journal contexts (admin)
      description: |
        Returns a paginated list of all journal contexts with their current
        lifecycle status. Supports filtering by status, period, teacher, group,
        and discipline.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter by lifecycle status
          schema:
            type: string
            enum: [active, locked, archived]
        - name: period_id
          in: query
          schema:
            type: string
            format: uuid
        - name: teacher_id
          in: query
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          schema:
            type: string
            format: uuid
        - name: discipline_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated list of journal contexts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJournalListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/journals/{journal_context_id}:
    get:
      tags: [admin-journals]
      operationId: getAdminJournal
      summary: Get one journal context (admin)
      description: |
        Returns a single journal context by ID, including full lifecycle metadata
        (`locked_at`, `locked_by`, `locked_reason`, `archived_*`).

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: journal_context_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Journal context object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJournalContext'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/journals/{journal_context_id}/export:
    get:
      tags: [admin-journals]
      operationId: exportAdminJournal
      summary: Export one journal context as CSV
      description: |
        Downloads a CSV export for the selected `journal_context_id`.
        The export contains normalized attendance and grade rows for the
        journal scope and creates a `JOURNAL_EXPORTED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: journal_context_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: CSV journal export
          content:
            text/csv:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/journals/{journal_context_id}/lock:
    post:
      tags: [admin-journals]
      operationId: lockJournal
      summary: Lock a journal context (temporary freeze)
      description: |
        **Заморозка журнала** — переводит контекст из `active` в `locked`.
        Временно запрещает запись (посещаемость, оценки). Снимается через `unlock`.
        Для закрытия журнала по завершении периода используйте `archive`, не lock.

        Creates a `JOURNAL_LOCKED` audit event.

        **Allowed from:** `active` only.
        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: journal_context_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminJournalActionRequest'
            examples:
              lock:
                summary: Заморозка журнала
                value:
                  reason: Промежуточная аттестация — журнал заморожен до 25 мая
      responses:
        "200":
          description: Updated journal context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJournalContext'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/journals/{journal_context_id}/unlock:
    post:
      tags: [admin-journals]
      operationId: unlockJournal
      summary: Unlock a journal context (end freeze)
      description: |
        **Снятие заморозки** — переводит журнал из `locked` в `active`.
        Используется после временной блокировки (lock), не после архивирования.

        Creates a `JOURNAL_UNLOCKED` audit event.

        **Allowed from:** `locked` only.
        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: journal_context_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminJournalActionRequest'
            examples:
              unlock:
                summary: Снятие заморозки
                value:
                  reason: Аттестация завершена — журнал снова открыт для записи
      responses:
        "200":
          description: Updated journal context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJournalContext'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/journals/{journal_context_id}/archive:
    post:
      tags: [admin-journals]
      operationId: archiveJournal
      summary: Archive a journal context (close for storage)
      description: |
        **Архивирование журнала** — переводит контекст из `active` в `archived`.
        Журнал закрыт для редактирования (посещаемость и оценки не принимаются).
        Это не заморозка: для временной блокировки используйте `lock` / `unlock`.

        Creates a `JOURNAL_ARCHIVED` audit event.

        **Allowed from:** `active` only (если журнал в `locked` — сначала `unlock`).
        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: journal_context_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminJournalActionRequest'
            examples:
              archive:
                summary: Архивирование журнала
                value:
                  reason: Семестр завершён — журнал передан в архив
      responses:
        "200":
          description: Updated journal context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJournalContext'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/journals/{journal_context_id}/restore:
    post:
      tags: [admin-journals]
      operationId: restoreJournal
      summary: Restore an archived journal context (from archive)
      description: |
        **Восстановление из архива** — переводит журнал из `archived` в `active`.
        Возвращает журнал в рабочее состояние после архивирования.
        Не путать с `unlock`: unlock снимает только заморозку (`locked` → `active`).

        Creates a `JOURNAL_RESTORED` audit event.

        **Allowed from:** `archived` only.
        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: journal_context_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminJournalActionRequest'
            examples:
              restore:
                summary: Восстановление из архива
                value:
                  reason: Ошибочное архивирование — журнал возвращён в работу
      responses:
        "200":
          description: Updated journal context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJournalContext'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Admin Users ----------------------------------------------------------
  /admin/users:
    get:
      tags: [admin-users]
      operationId: listAdminUsers
      summary: List local user profiles for administration
      description: |
        Returns local backend profiles for teachers and students. These profiles
        are managed by the application even when authentication and base roles
        come from external IAM/Keycloak.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          description: Search by full name, email or username
          schema:
            type: string
        - name: user_type
          in: query
          schema:
            type: string
            enum: [teacher, student]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, blocked]
      responses:
        "200":
          description: Paginated list of local user profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Admin Access Bindings ------------------------------------------------
  /admin/access-bindings:
    get:
      tags: [admin-access]
      operationId: listAdminAccessBindings
      summary: List subject access bindings
      description: |
        Returns teacher-to-teacher access bindings backed by `journal_access_grants`.
        Direct administrative management for teaching assignments and starosta
        grants is exposed through typed subresources under this collection.

        `active_only=true` excludes revoked and expired bindings.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: grantee_id
          in: query
          required: false
          description: Filter by grantee Keycloak UUID
          schema:
            type: string
        - name: granter_id
          in: query
          required: false
          description: Filter by granter Keycloak UUID
          schema:
            type: string
        - name: discipline_id
          in: query
          required: false
          description: Filter by discipline UUID
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          required: false
          description: Filter by academic group UUID
          schema:
            type: string
            format: uuid
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of admin access bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessBindingListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [admin-access]
      operationId: createAdminAccessBinding
      summary: Create a subject access binding
      description: |
        Creates a teacher-to-teacher journal access delegation on behalf of a
        source teacher.

        The `granter_id` field is required for the admin endpoint and must
        refer to a teacher that has an active source journal context or teaching
        assignment for the requested group, discipline and optional period.

        Creates an `ACCESS_BINDING_CREATED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccessBindingCreateRequest'
      responses:
        "201":
          description: Access binding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessBindingResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/access-bindings/{binding_id}:
    get:
      tags: [admin-access]
      operationId: getAdminAccessBinding
      summary: Get a subject access binding
      security:
        - bearerAuth: []
      parameters:
        - name: binding_id
          in: path
          required: true
          description: Access binding UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Access binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessBindingResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [admin-access]
      operationId: revokeAdminAccessBinding
      summary: Revoke a subject access binding
      description: |
        Soft-revokes the binding (`journal_access_grants.revoked_at = NOW()`).
        Creates an `ACCESS_BINDING_REVOKED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: binding_id
          in: path
          required: true
          description: Access binding UUID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Access binding revoked
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/access-bindings/teaching-assignments:
    get:
      tags: [admin-access]
      operationId: listAdminTeachingAssignments
      summary: List teaching assignment bindings
      description: |
        Returns direct teacher-to-discipline/group/period assignments backed by
        `teaching_assignments`.

        `active_only=true` excludes revoked assignments.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: teacher_id
          in: query
          required: false
          description: Filter by internal teacher_profiles.id UUID
          schema:
            type: string
            format: uuid
        - name: discipline_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of teaching assignment bindings
          content:
