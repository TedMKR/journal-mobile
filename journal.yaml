          $ref: '#/components/schemas/ListMeta'

    Teacher:
      type: object
      required: [id, full_name]
      properties:
        id:
          type: string
          format: uuid
          description: Internal `teacher_profiles.id`.
        keycloak_id:
          type: string
          format: uuid
          nullable: true
        full_name:
          type: string
        email:
          type: string
          nullable: true
        external_schedule_ref:
          type: string
          nullable: true

    TeacherListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Teacher'
        meta:
          $ref: '#/components/schemas/ListMeta'

    AcademicGroup:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        faculty:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true

    GroupListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AcademicGroup'
        meta:
          $ref: '#/components/schemas/ListMeta'

    # -- Lessons / Schedule -------------------------------------------------
    Lesson:
      type: object
      required: [id, discipline_id, discipline_name, group_id, group_name, teacher_id, scheduled_at, lesson_type, status]
      properties:
        id:
          type: string
          format: uuid
        discipline_id:
          type: string
          format: uuid
        discipline_name:
          type: string
          description: Display name of the discipline
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
          description: Display name of the academic group
        subgroup_id:
          type: string
          format: uuid
          nullable: true
        teacher_id:
          type: string
          format: uuid
          description: Internal `teacher_profiles.id` of the teacher.
        scheduled_at:
          type: string
          format: date-time
          description: Lesson start datetime (RFC3339)
        ends_at:
          type: string
          format: date-time
          nullable: true
          description: Lesson end datetime (RFC3339)
        lesson_order_number:
          type: integer
          minimum: 1
          maximum: 8
          nullable: true
          description: Real pair number from the external schedule when available.
        lesson_type:
          type: string
          enum: [lecture, practice, lab, seminar]
          description: Type of the lesson
        location:
          type: string
          nullable: true
          description: Classroom and building (e.g. "ауд. 301, корп. А")
        status:
          type: string
          enum: [planned, held, cancelled, rescheduled]
        attendance_marked:
          type: boolean
          description: True if at least one attendance record exists for this lesson
        period_id:
          type: string
          format: uuid
          nullable: true
          description: Academic period this lesson belongs to

    # -- Students -----------------------------------------------------------
    Student:
      type: object
      required: [id, full_name, student_code]
      properties:
        id:
          type: string
          format: uuid
          description: StudentProfile UUID (used as student_id in attendance/grade records)
        full_name:
          type: string
          description: Full name (Last First Patronymic)
          example: "Иванов Иван Иванович"
        student_code:
          type: string
          description: Student ID / gradebook number
          example: "23-ИВТ-001"
        subgroup_id:
          type: string
          format: uuid
          nullable: true
          description: Subgroup the student belongs to (if applicable)

    # -- Attendance ---------------------------------------------------------
    AttendanceRecord:
      type: object
      required: [id, lesson_id, student_id, status, is_late_entry, is_archived, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [present, absent, valid_excuse]
          description: |
            Attendance status:
            - `present` - student was present
            - `absent` - student was absent without a valid reason
            - `valid_excuse` - student was absent with a valid excuse (medical certificate, order)
        comment:
          type: string
          nullable: true
        is_late_entry:
          type: boolean
          description: |
            True if this record was created or last modified after the academic period was closed.
            Post-session entries are allowed only for users with admin role or explicitly granted late-entry permission.
        late_entry_reason:
          type: string
          nullable: true
          description: Optional reason provided when making a post-session entry
        is_archived:
          type: boolean
          description: |
            True if this record has been soft-deleted (archived).
            Archived records are excluded from all operational views by default.
            Use `include_archived=true` on the list endpoint to retrieve them.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 timestamp of when the record was archived. Null if not archived.
        archived_by:
          type: string
          format: uuid
          nullable: true
          description: UUID of the user who archived this record. Null if not archived.
        archive_reason:
          type: string
          nullable: true
          description: Optional reason provided when archiving the record.
        created_at:
          type: string
          format: date-time
          description: RFC3339 timestamp
        updated_at:
          type: string
          format: date-time

    MarkAttendanceRequest:
      type: object
      required: [student_id, status]
      properties:
        student_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [present, absent, valid_excuse]
          description: |
            Attendance status:
            - `present` - student was present
            - `absent` - student was absent without a valid reason
            - `valid_excuse` - student was absent with a valid excuse
        comment:
          type: string
          maxLength: 500
          nullable: true
        is_late_entry:
          type: boolean
          default: false
          description: |
            Set to true to allow writing to a closed academic period (post-session entry).
            Requires admin role, or explicit late-entry permission on the teacher profile.
        late_entry_reason:
          type: string
          maxLength: 500
          nullable: true
          description: Required when is_late_entry is true; explains why the entry is made after period close

    BulkMarkAttendanceRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MarkAttendanceRequest'

    ArchiveRecordRequest:
      type: object
      description: Optional request body for archive operations. All fields are optional.
      properties:
        reason:
          type: string
          maxLength: 500
          nullable: true
          description: |
            Human-readable reason for archiving this record.
            Stored as `archive_reason` and included in the `AuditEvent`.
          example: "Data entry error - duplicate record"

    # -- Grades -------------------------------------------------------------
    GradeRecord:
      type: object
      required: [id, student_id, assessment_form_id, value, is_private, is_late_entry, is_archived, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        assessment_form_id:
          type: string
          format: uuid
        value:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        is_private:
          type: boolean
        is_late_entry:
          type: boolean
          description: True if this grade was entered after the academic period was closed
        late_entry_reason:
          type: string
          nullable: true
        is_archived:
          type: boolean
          description: |
            True if this record has been soft-deleted (archived).
            Archived records are excluded from all operational views by default.
            Use `include_archived=true` on the list endpoint to retrieve them.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 timestamp of when the record was archived. Null if not archived.
        archived_by:
          type: string
          format: uuid
          nullable: true
          description: UUID of the user who archived this record. Null if not archived.
        archive_reason:
          type: string
          nullable: true
          description: Optional reason provided when archiving the record.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGradeRequest:
      type: object
      required: [student_id, assessment_form_id, value]
      properties:
        student_id:
          type: string
          format: uuid
        assessment_form_id:
          type: string
          format: uuid
        value:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          nullable: true
        is_private:
          type: boolean
          default: false
        is_late_entry:
          type: boolean
          default: false
          description: Set to true to create a grade in a closed period (requires admin role)
        late_entry_reason:
          type: string
          maxLength: 500
          nullable: true

    UpdateGradeRequest:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          nullable: true
        is_late_entry:
          type: boolean
          default: false
          description: Set to true to update a grade in a closed period (requires admin role)
        late_entry_reason:
          type: string
          maxLength: 500
          nullable: true

    # -- Assessment Forms ---------------------------------------------------
    AssessmentForm:
      type: object
      required: [id, title, form_type, date, discipline_id, group_id, teacher_id, period_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        form_type:
          type: string
          enum: [exam, quiz, homework, project, colloquium, survey, lab_work, control_work, essay, final_grade]
        date:
          type: string
          format: date
          description: RFC3339 date (YYYY-MM-DD)
        discipline_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
          description: Internal `teacher_profiles.id` of the teacher.
        period_id:
          type: string
          format: uuid
          description: Academic period the form belongs to.
        created_at:
          type: string
          format: date-time

    UpdateAssessmentFormRequest:
      type: object
      description: |
        At least one of `title`, `form_type` or `date` must be provided.
        `discipline_id`, `group_id` and `teacher_id` stay immutable after creation.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: New title for the assessment form
        form_type:
          type: string
          enum: [exam, quiz, homework, project, colloquium, survey, lab_work, control_work, essay, final_grade]
          description: New assessment form type
        date:
          type: string
          format: date
          description: New form date (YYYY-MM-DD); period_id is re-resolved from this date
    CreateAssessmentFormRequest:
      type: object
      required: [title, form_type, date, discipline_id, group_id]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        form_type:
          type: string
          enum: [exam, quiz, homework, project, colloquium, survey, lab_work, control_work, essay, final_grade]
        date:
          type: string
          format: date
        discipline_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
          description: |
            Optional. Academic period for this form. When omitted the server resolves
            the currently open period that contains the form date.

    # -- Reports ------------------------------------------------------------
    RequestReportRequest:
      type: object
      required: [report_type, format]
      properties:
        report_type:
          type: string
          enum: [attendance_summary, grade_sheet, group_performance, current_attestation_statement]
        format:
          type: string
          enum: [pdf, excel, docx]
        group_id:
          type: string
          format: uuid
          nullable: true
        discipline_id:
          type: string
          format: uuid
          nullable: true
        period_id:
          type: string
          format: uuid
          nullable: true
        academic_period_id:
          type: string
          format: uuid
          nullable: true
          description: Alias for period_id used by journal endpoints.
        teacher_id:
          type: string
          format: uuid
          nullable: true
        return_to_department_by:
          type: string
          format: date
          nullable: true
        progress_as_of:
          type: string
          format: date
          nullable: true
        overrides:
          $ref: '#/components/schemas/CurrentAttestationStatementOverrides'
        options:
          $ref: '#/components/schemas/CurrentAttestationStatementOptions'

    AdminCurrentAttestationDocumentRequest:
      type: object
      required:
        - format
        - group_id
        - discipline_id
        - academic_period_id
        - teacher_id
        - return_to_department_by
        - progress_as_of
      properties:
        format:
          type: string
          enum: [docx, pdf]
          default: docx
        group_id:
          type: string
          format: uuid
        discipline_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
          nullable: true
        academic_period_id:
          type: string
          format: uuid
          nullable: true
          description: Alias for period_id used by journal endpoints.
        teacher_id:
          type: string
          format: uuid
        return_to_department_by:
          type: string
          format: date
        progress_as_of:
          type: string
          format: date
        overrides:
          $ref: '#/components/schemas/CurrentAttestationStatementOverrides'
        options:
          $ref: '#/components/schemas/CurrentAttestationStatementOptions'

    AdminDocumentListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTask'
        meta:
          type: object
          required: [total, page, page_size]
          properties:
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer

    StatementTemplate:
      type: object
      required: [id, report_type, name, formats]
      properties:
        id:
          type: string
        report_type:
          type: string
          enum: [current_attestation_statement]
        name:
          type: string
        formats:
          type: array
          items:
            type: string
            enum: [docx, pdf]
        template_path:
          type: string

    StatementTemplateListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatementTemplate'

    CurrentAttestationStatementOverrides:
      type: object
      properties:
        semester_label:
          type: string
        faculty_name:
          type: string
        department_name:
          type: string
        lecture_teacher_name:
          type: string
        practice_teacher_name:
          type: string

    CurrentAttestationStatementOptions:
      type: object
      properties:
        include_lecture_absences:
          type: boolean
        include_practice_absences:
          type: boolean
        include_colloquiums:
          type: boolean
        include_labs:
          type: boolean
        include_control_works:
          type: boolean
        include_final_grade:
          type: boolean

    CurrentAttestationPrefill:
      type: object
      required: [report_type, available_formats, context, defaults, students]
      properties:
        report_type:
          type: string
          enum: [current_attestation_statement]
        available_formats:
          type: array
          items:
            type: string
            enum: [docx, pdf]
        context:
          $ref: '#/components/schemas/CurrentAttestationPrefillContext'
        defaults:
          $ref: '#/components/schemas/CurrentAttestationPrefillDefaults'
        students:
          type: array
          items:
            $ref: '#/components/schemas/CurrentAttestationPrefillStudent'

    CurrentAttestationPrefillContext:
      type: object
      required:
        - group_id
        - group_name
        - discipline_id
        - discipline_name
        - academic_period_id
        - academic_period_name
        - academic_period_start
        - academic_period_end
        - course
        - faculty_name
        - department_name
        - lecture_teacher_name
        - practice_teacher_name
      properties:
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
        discipline_id:
          type: string
          format: uuid
        discipline_name:
          type: string
        academic_period_id:
          type: string
          format: uuid
        academic_period_name:
          type: string
        academic_period_start:
          type: string
          format: date
        academic_period_end:
          type: string
          format: date
        teacher_id:
          type: string
          format: uuid
          nullable: true
        course:
          type: integer
        faculty_name:
          type: string
        department_name:
          type: string
        lecture_teacher_name:
          type: string
        practice_teacher_name:
          type: string

    CurrentAttestationPrefillDefaults:
      type: object
      required: [format, overrides, options]
      properties:
        format:
          type: string
          enum: [docx, pdf]
        overrides:
          $ref: '#/components/schemas/CurrentAttestationStatementOverrides'
        options:
          $ref: '#/components/schemas/CurrentAttestationStatementOptions'

    CurrentAttestationPrefillStudent:
      type: object
      required: [number, id, full_name]
      properties:
        number:
          type: integer
        id:
          type: string
          format: uuid
        full_name:
          type: string
        student_code:
          type: string

    DocumentTask:
      type: object
      required: [id, job_type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        job_type:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed, permanently_failed]
        result:
          type: object
          nullable: true
          description: Available when status is 'done'; contains file_path, file_name, content_type and generated_at.
        error_msg:
          type: string
          nullable: true
        retry_count:
          type: integer
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    # -- Journal Access Grant schemas ------------------------------------------
    JournalAccessGrant:
      type: object
      required: [id, granter_id, grantee_id, discipline_id, group_id, access_level, granted_at]
      description: |
        A teacher-to-teacher journal access delegation.
        The granter shares read or write access to a specific discipline + group journal
        with the grantee.
      properties:
        id:
          type: string
          format: uuid
          description: Grant UUID
        granter_id:
          type: string
          description: Keycloak UUID of the teacher who issued the grant
        grantee_id:
          type: string
          description: Keycloak UUID of the teacher who received access
        discipline_id:
          type: string
          format: uuid
          description: Discipline the grant is scoped to
        group_id:
          type: string
          format: uuid
          description: Academic group the grant is scoped to
        period_id:
          type: string
          format: uuid
          nullable: true
          description: Academic period the grant is scoped to. New grants always have a value.
        access_level:
          $ref: '#/components/schemas/JournalAccessGrantAccessLevel'
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Automatic expiry date (null = no expiry)
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Revocation timestamp (null = grant is active)

    JournalAccessGrantAccessLevel:
      type: string
      enum: [read, write]
      description: |
        - `read`  - grantee can view lessons, attendance, and grades.
        - `write` - grantee can additionally mark attendance and submit grades.

    GrantJournalAccessRequest:
      type: object
      required: [grantee_id, discipline_id, group_id, period_id, access_level]
      description: Request body for creating a journal access delegation
      properties:
        granter_id:
          type: string
          description: |
            Keycloak UUID of the teacher issuing the grant.
            For `teacher` role, defaults to the caller's own ID.
            For `admin` role, can specify a different teacher as granter.
        grantee_id:
          type: string
          description: Keycloak UUID of the teacher who will receive access
        discipline_id:
          type: string
          format: uuid
          description: Discipline to share
        group_id:
          type: string
          format: uuid
          description: Academic group to share
        period_id:
          type: string
          format: uuid
          description: Academic period to share. All-period grants are intentionally unsupported.
        access_level:
          $ref: '#/components/schemas/JournalAccessGrantAccessLevel'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional automatic expiry (e.g. end of semester)

    AdminAccessBinding:
      allOf:
        - $ref: '#/components/schemas/JournalAccessGrant'
      description: |
        Administrative access binding. MVP representation is a
        `JournalAccessGrant`; future binding types can extend this schema.

    AdminAccessBindingCreateRequest:
      allOf:
        - $ref: '#/components/schemas/GrantJournalAccessRequest'
      required: [granter_id, grantee_id, discipline_id, group_id, access_level]
      description: |
        Admin request for creating a journal access binding. Unlike the teacher
        endpoint, `granter_id` is required because the admin issues access on
        behalf of a source teacher.

    AdminAccessBindingResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminAccessBinding'

    AdminAccessBindingListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccessBinding'

    AdminTeachingAssignmentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminTeachingAssignment'

    AdminTeachingAssignmentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminTeachingAssignment'

    AdminHeadStudentGrantResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HeadStudentGrant'

    AdminHeadStudentGrantListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HeadStudentGrant'

    # -- Lesson Template schemas ------------------------------------------------
    LessonTemplate:
      type: object
      required: [id, discipline_id, discipline_name, name, total_lessons, topics_count, has_assignments, is_archived, created_by, created_at, updated_at]
      description: Summary view of a КТП (calendar-thematic plan) template
      properties:
        id:
          type: string
          format: uuid
        discipline_id:
          type: string
          format: uuid
        discipline_name:
          type: string
          description: Display name of the discipline this template belongs to
        name:
          type: string
          description: Template name (e.g. "Программирование на Python, осень 2024")
        description:
          type: string
          nullable: true
          description: Optional extended description / notes
        total_lessons:
          type: integer
          description: Total number of lessons covered by all topics combined
        topics_count:
          type: integer
          description: Number of topics in this template
        has_assignments:
          type: boolean
          description: True if this template is currently assigned to at least one teaching context
        is_archived:
          type: boolean
          description: True if the template has been soft-deleted (archived)
        created_by:
          type: string
          description: Keycloak UUID of the user who created the template
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LessonTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/LessonTemplate'
        - type: object
          required: [topics]
          properties:
            topics:
              type: array
              description: Ordered list of topics in this template
              items:
                $ref: '#/components/schemas/LessonTopic'

    LessonTopic:
      type: object
      required: [id, plan_id, topic_name, lesson_count, order_index, is_frozen, created_at, updated_at]
      description: A single topic entry within a КТП template
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
          description: Parent template UUID
        topic_name:
          type: string
          description: Topic title
        topic_description:
          type: string
          nullable: true
          description: Extended topic description
        lesson_count:
          type: integer
          minimum: 1
          description: Number of lessons this topic spans
        order_index:
          type: integer
          minimum: 1
          description: Position of this topic in the plan (1-based)
        is_frozen:
          type: boolean
          description: True if the topic is locked because lessons have already been taught with it
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LessonTemplateArchivedResponse:
      type: object
      required: [is_archived, message]
      description: Returned when a template is soft-deleted (has active assignments)
      properties:
        is_archived:
          type: boolean
          example: true
        message:
          type: string
          example: "Template archived because it has active assignments"

    TemplateAssignment:
      type: object
      required: [id, teacher_id, discipline_id, group_id, period_id, plan_id, plan_name, assigned_by, assigned_at]
      description: An active КТП template assignment for a teaching context
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
          description: Internal `teacher_profiles.id` of the teacher.
        discipline_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
          description: UUID of the assigned template
        plan_name:
          type: string
          description: Display name of the assigned template
        assigned_by:
          type: string
          description: Keycloak UUID of the user who created the assignment
        assigned_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the assignment has been revoked
        notes:
          type: string
          nullable: true
          description: Optional notes about the assignment

    AssignTemplateResult:
      type: object
      required: [assignment_id, plan_id, plan_name, lessons_updated, lessons_without_topic]
      description: Result of assigning a template to a teaching context
      properties:
        assignment_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        lessons_updated:
          type: integer
          description: Number of lessons that were mapped to a template topic
        lessons_without_topic:
          type: integer
          description: Number of lessons that could not be mapped (template doesn't cover enough lessons)

    LessonTopicInfo:
      type: object
      required: [lesson_id, topic_details_edited_by_teacher, updated_at]
      description: Topic information for a specific lesson, combining template topic and teacher notes
      properties:
        lesson_id:
          type: string
          format: uuid
        template_topic:
          $ref: '#/components/schemas/LessonTopic'
          nullable: true
          description: The template topic assigned to this lesson (null if no template assigned)
        topic_custom_details:
          type: string
          nullable: true
          description: Teacher's lesson notes for this lesson
        topic_details_edited_by_teacher:
          type: boolean
          description: True if the teacher has set their own custom details for this lesson
        updated_at:
          type: string
          format: date-time

    # -- КТП Request schemas ----------------------------------------------------
    CreateLessonTemplateRequest:
      type: object
      required: [discipline_id, name]
      properties:
        discipline_id:
          type: string
          format: uuid
          description: Discipline this template belongs to
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Template name
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional description / notes

    UpdateLessonTemplateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true

    AddTopicRequest:
      type: object
      required: [topic_name, lesson_count, order_index]
      properties:
        topic_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Topic title
        topic_description:
          type: string
          maxLength: 2000
          nullable: true
          description: Extended topic description
        lesson_count:
          type: integer
          minimum: 1
          description: Number of lessons this topic covers
        order_index:
          type: integer
          minimum: 1
          description: Position of this topic in the plan (1-based)

    UpdateTopicRequest:
      type: object
      properties:
        topic_name:
          type: string
          minLength: 1
          maxLength: 255
        topic_description:
          type: string
          maxLength: 2000
          nullable: true
        lesson_count:
          type: integer
          minimum: 1
        order_index:
          type: integer
          minimum: 1

    ReorderTopicsRequest:
      type: object
      required: [order]
      properties:
        order:
          type: array
          minItems: 1
          description: New ordering - every topic in the template must be listed
          items:
            type: object
            required: [topic_id, order_index]
            properties:
              topic_id:
                type: string
                format: uuid
              order_index:
                type: integer
                minimum: 1

    AssignTemplateRequest:
      type: object
      required: [plan_id, discipline_id, group_id, period_id]
      properties:
        teacher_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Internal `teacher_profiles.id` or teacher Keycloak UUID. Required for `methodologist`/`admin`.
            Teachers may omit it and can only assign templates to themselves.
        plan_id:
          type: string
          format: uuid
          description: Template UUID to assign
        discipline_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional notes about this assignment

    CreateLessonTemplateBulkRequest:
      type: object
      required: [discipline_id, name, topics]
      description: |
        Structured КТП payload produced by frontend after parsing Excel/XLSX.
        Backend receives JSON only and creates the plan and topics atomically.
      properties:
        discipline_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true
        topics:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/AddTopicRequest'

    UpdateLessonTopicDetailsRequest:
      type: object
      required: [topic_custom_details]
      properties:
        topic_custom_details:
          type: string
          minLength: 1
          maxLength: 5000
          description: Teacher's custom lesson notes for this specific lesson

    # -- Student Import schemas -------------------------------------------------

    ImportStudentRow:
      type: object
      required: [row_number, last_name, first_name]
      description: |
        A single student row submitted for import.
        The client is responsible for parsing Excel/CSV - the server accepts JSON only.
      properties:
        row_number:
          type: integer
          minimum: 1
          description: 1-based row number from the source file (used for error reporting)
        last_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Student's last name (required)
        first_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Student's first name (required)
        middle_name:
          type: string
          maxLength: 128
          nullable: true
        email:
          type: string
          format: email
          nullable: true
          description: Used as secondary matching key if student_code is absent
        student_code:
          type: string
          maxLength: 64
          nullable: true
          description: University-assigned student ID. Primary matching key during import.
        subgroup_number:
          type: integer
          minimum: 1
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
          description: Date from which this enrollment is active. Defaults to period start_date.

    ImportStudentsRequest:
      type: object
      required: [group_id, academic_period_id, students]
      description: |
        Payload for creating a new student import batch.
        Clients parse Excel/CSV themselves and submit the JSON list.
      properties:
        import_mode:
          type: string
          enum: [merge, replace_active_roster]
          default: merge
          description: |
            `merge` adds/updates submitted rows without removing missing students.
            `replace_active_roster` treats the submitted rows as the authoritative active roster for the group.
        group_id:
          type: string
          format: uuid
          description: Target group for all imported students
        academic_period_id:
          type: string
          format: uuid
          description: Academic period for enrollment records
        source_file_name:
          type: string
          maxLength: 255
          nullable: true
          description: Original file name for traceability (e.g. "group_101_spring2026.xlsx")
        students:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ImportStudentRow'

    ImportSummary:
      type: object
      required: [total, created, updated, skipped, conflicts, errors]
      properties:
        total:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        conflicts:
          type: integer
        errors:
          type: integer

    ImportConflict:
      type: object
      required: [id, batch_id, row_number, conflict_type, resolution]
      description: |
        A conflict detected during import preview that requires an explicit admin decision.
        Apply is blocked until all conflicts have a resolution != pending.
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        row_number:
          type: integer
        conflict_type:
          type: string
          enum: [duplicate_in_batch, already_enrolled, already_in_other_group, name_mismatch, profile_not_found]
          description: |
            - `duplicate_in_batch`: same student appears twice in the submitted JSON
            - `already_enrolled`: student already active in this exact group+period
            - `already_in_other_group`: student active in a DIFFERENT group
            - `name_mismatch`: profile found by code/email but full name differs
            - `profile_not_found`: cannot identify the student (no code, no email)
        current_state:
          type: object
          nullable: true
          additionalProperties: true
          description: Snapshot of what exists in the database
        proposed:
          type: object
          nullable: true
          additionalProperties: true
          description: What the import row proposes
        resolution:
          type: string
          enum: [pending, skip, merge, force_move, force_create, update]
          description: |
            - `pending`: not resolved yet (blocks apply)
            - `skip`: ignore this row
            - `merge`: accept new name (for name_mismatch)
            - `force_move`: transfer student to target group (closes old enrollment)
            - `force_create`: create new profile despite ambiguity
            - `update`: update subgroup or dates for existing enrollment
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          type: string
          nullable: true
          description: Keycloak sub claim of the admin who resolved the conflict

    ImportPreviewRow:
      type: object
      required: [row_number, action]
      description: Preview of what will happen to a single import row after apply
      properties:
        row_number:
          type: integer
        action:
          type: string
          enum: [create, update, skip, conflict, error]
        conflict_id:
          type: string
          format: uuid
          nullable: true
        conflict_type:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
          description: Machine-readable row-level error code, e.g. `STUDENT_ALREADY_EXISTS`
        student:
          $ref: '#/components/schemas/ImportStudentRow'
          nullable: true

    ImportBatchPreview:
      type: object
      required: [batch_id, status, summary, rows]
      description: Full preview returned immediately after batch submission
      properties:
        batch_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, validating, preview_ready, conflicts_detected, resolved, applying, completed, failed, partial, cancelled]
        summary:
          $ref: '#/components/schemas/ImportSummary'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportPreviewRow'
        conflicts:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ImportConflict'

    ImportBatchHistoryItem:
      type: object
      required: [id, import_type, import_mode, started_by, started_at, status, errors_count, warnings_count, conflicts_count]
      description: Compact import batch row for admin diagnostics and history lists.
      properties:
        id:
          type: string
          format: uuid
        import_type:
          type: string
          example: students
        import_mode:
          type: string
          enum: [merge, replace_active_roster]
        group_id:
          type: string
          format: uuid
          nullable: true
        group_name:
          type: string
          nullable: true
        period_id:
          type: string
          format: uuid
          nullable: true
        period_name:
          type: string
          nullable: true
        source_file_name:
          type: string
          nullable: true
        started_by:
          type: string
          description: Keycloak sub claim of the user who started the import.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, validating, preview_ready, conflicts_detected, resolved, applying, completed, failed, partial, cancelled]
        summary:
          $ref: '#/components/schemas/ImportSummary'
          nullable: true
        errors_count:
          type: integer
          description: Persisted row-level errors for this batch.
        warnings_count:
          type: integer
          description: Persisted row-level warnings for this batch.
        conflicts_count:
          type: integer
          description: Persisted conflicts for this batch.

    ImportBatchHistoryListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatchHistoryItem'
        meta:
          type: object
          required: [total, page, page_size]
          properties:
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer

    ImportBatchStatus:
      type: object
      required: [id, status, started_by, started_at]
      description: Current status of an import batch
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, validating, preview_ready, conflicts_detected, resolved, applying, completed, failed, partial, cancelled]
        group_id:
          type: string
          format: uuid
          nullable: true
        period_id:
          type: string
          format: uuid
          nullable: true
        source_file_name:
          type: string
          nullable: true
        started_by:
          type: string
          description: Keycloak sub claim of the admin who started the import
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        summary:
          $ref: '#/components/schemas/ImportSummary'
          nullable: true

    ImportItemError:
      type: object
      required: [id, batch_id, severity, error_code, message]
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        row_number:
          type: integer
          nullable: true
        severity:
          type: string
          enum: [error, warning, info]
        error_code:
          type: string
          description: Machine-readable validation or processing code.
        message:
          type: string
        raw_value:
          type: string
          nullable: true

    ImportItemErrorsResponse:
      type: object
      required: [batch_id, errors]
      properties:
        batch_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportItemError'

    ImportConflictsResponse:
      type: object
      required: [batch_id, conflicts]
      properties:
        batch_id:
          type: string
          format: uuid
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ImportConflict'

    ResolveConflictRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [skip, merge, force_move, force_create, update]
          description: Admin decision for this conflict

    ImportApplyResult:
      type: object
      required: [batch_id, status, summary]
      description: Result returned after the apply operation completes
      properties:
        batch_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, partial, failed]
        summary:
          $ref: '#/components/schemas/ImportSummary'

  responses:
    Unauthorized:
      description: Authentication required or token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: |
        Conflict - the operation cannot proceed due to the current state of the resource.
        Examples: duplicate record, record already archived, record not archived (restore).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PeriodClosed:
      description: Academic period is closed for editing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    JournalWriteBlocked:
      description: |
        Journal write is blocked. Returned when the academic period is closed
        (`PERIOD_CLOSED`) or when the journal context is locked/archived
        (`JOURNAL_LOCKED`, `JOURNAL_ARCHIVED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
