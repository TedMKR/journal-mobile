        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [admin-users]
      operationId: updateAdminUser
      summary: Update local user profile fields
      description: |
        Updates local profile fields. For teacher profiles, changing name or email
        locks profile sync by default so the next IAM login does not overwrite
        the administrator correction.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
