        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [admin-access]
      operationId: createAdminHeadStudentGrant
      summary: Create or refresh a head-student grant binding
      description: |
        Creates or refreshes a starosta access grant for a group and discipline.
        When `granted_by` is omitted, the admin actor id is stored.

        Creates an `ACCESS_BINDING_CREATED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
