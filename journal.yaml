        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMarkAttendanceRequest'
      responses:
        "200":
          description: Attendance marked successfully - returns the persisted state of every upserted record
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttendanceRecord'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/JournalWriteBlocked'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Assessment Forms ----------------------------------------------------
  /assessment-forms:
    get:
      tags: [grades]
      operationId: listAssessmentForms
      summary: List assessment forms for a journal context
      description: |
        Returns all assessment forms for the given `group_id` + `discipline_id` combination,
        ordered by `form_date` ascending then `created_at` ascending.

        This is the primary read-side endpoint for **building the grade columns** in the
        teacher journal grid. Each returned form corresponds to one grade column.

        Both `group_id` and `discipline_id` are **required** - the server rejects requests
        without them to prevent full-table scans.

        Optional filters:
        - `period_id` - scope to a specific semester.
        - `teacher_id` - limit to forms created by a specific teacher (methodologist/admin use; Keycloak UUID is accepted and resolved internally).
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: query
          required: true
          description: Academic group UUID
          schema:
            type: string
            format: uuid
        - name: discipline_id
          in: query
          required: true
          description: Discipline UUID
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          description: Academic period UUID (defaults to all periods)
          schema:
            type: string
            format: uuid
        - name: teacher_id
          in: query
          required: false
          description: |
            Optional teacher filter for admin/methodologist views.
            Public callers may pass the teacher Keycloak UUID; the domain resolves it
            to the internal `teacher_profiles.id` used by persisted journal rows.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of assessment forms ordered by date
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssessmentForm'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [grades]
      operationId: createAssessmentForm
      summary: Create a new assessment form
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentFormRequest'
      responses:
        "201":
          description: Assessment form created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentForm'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/JournalWriteBlocked'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /assessment-forms/{assessment_form_id}:
    get:
      tags: [grades]
      operationId: getAssessmentForm
      summary: Get a single assessment form by ID
      description: |
        Returns the full assessment form object. Useful for detail views,
        Postman testing, and verifying the resolved `period_id` after creation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentFormID'
      responses:
        "200":
          description: Assessment form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentForm'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [grades]
      operationId: updateAssessmentForm
      summary: Update assessment form details
      description: |
        Updates editable fields of an assessment form:

        - **Rename** - update `title` to reflect a corrected name.
        - **Change type** - update `form_type` when the teacher selected the wrong control form.
        - **Change date** - update `date`; the backend re-resolves `period_id` from the new date.

        Journal binding fields (`discipline_id`, `group_id`, `teacher_id`) are immutable after creation.

        At least one editable field must be provided.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentFormID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssessmentFormRequest'
      responses:
        "200":
          description: Updated assessment form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentForm'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/JournalWriteBlocked'
        "500":
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [grades]
      operationId: deleteAssessmentForm
      summary: Delete an assessment form
      description: |
        Soft-deletes the assessment form. It disappears from normal list/detail
        endpoints, while existing grade records remain in the database for audit/history.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentFormID'
      responses:
        "204":
          description: Assessment form deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/JournalWriteBlocked'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /assessment-forms/{assessment_form_id}/grades:
    get:
      tags: [grades]
      operationId: getGradesByAssessmentForm
      summary: Get all grades for an assessment form
      description: |
        Returns grade records for the given assessment form.
        By default only **active** (non-archived) records are returned.
        Pass `include_archived=true` to also retrieve soft-deleted records
        (teacher, admin only - students always see the filtered view).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentFormID'
        - name: include_archived
          in: query
          required: false
          description: |
            When `true`, include archived (soft-deleted) grade records in the response.
            Allowed for roles: `teacher`, `admin`. Ignored for `student`.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of grade records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GradeRecord'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Grades --------------------------------------------------------------
  /grades:
    post:
      tags: [grades]
      operationId: createGrade
      summary: Create a grade record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGradeRequest'
      responses:
        "201":
          description: Grade record created
