        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [admin-access]
      operationId: createAdminTeachingAssignment
      summary: Create a teaching assignment binding
      description: |
        Creates a direct active teaching assignment for a teacher, discipline,
        group and academic period. Duplicate active assignments for the same
        context return `409 Conflict`.

        Creates an `ACCESS_BINDING_CREATED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTeachingAssignmentCreateRequest'
      responses:
        "201":
          description: Teaching assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTeachingAssignmentResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/access-bindings/teaching-assignments/{assignment_id}:
    get:
      tags: [admin-access]
      operationId: getAdminTeachingAssignment
      summary: Get a teaching assignment binding
      security:
        - bearerAuth: []
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Teaching assignment binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTeachingAssignmentResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [admin-access]
      operationId: revokeAdminTeachingAssignment
      summary: Revoke a teaching assignment binding
      description: |
        Soft-revokes the assignment by setting `teaching_assignments.revoked_at = NOW()`.
        Creates an `ACCESS_BINDING_REVOKED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Teaching assignment revoked
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/access-bindings/head-student-grants:
