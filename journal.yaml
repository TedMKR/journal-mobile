        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/JournalWriteBlocked'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Attendance record archive / restore ----------------------------------
  /attendance-records/{attendance_id}/archive:
    post:
      tags: [attendance, archive]
      operationId: archiveAttendanceRecord
      summary: Archive (soft-delete) an attendance record
      description: |
        Marks the attendance record as archived (`is_archived = true`).
        The record is immediately hidden from operational views and excluded
        from all `GET /lessons/{id}/attendance` responses unless
        `include_archived=true` is passed.

        **Allowed roles:** `teacher`, `admin`.

        **409 Conflict** is returned if the record is already archived.
        An `AuditEvent` of type `attendance_record_archived` is persisted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AttendanceID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRecordRequest'
      responses:
        "200":
          description: Attendance record archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Record is already archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /attendance-records/{attendance_id}/restore:
    post:
      tags: [attendance, archive]
      operationId: restoreAttendanceRecord
      summary: Restore an archived attendance record
      description: |
        Clears the archive flag (`is_archived = false`) on the attendance record,
        making it visible again in operational views.

        **Allowed roles:** `teacher`, `admin`.

        **409 Conflict** is returned if the record is not archived (i.e., it is already active).
        An `AuditEvent` of type `attendance_record_restored` is persisted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AttendanceID'
      responses:
        "200":
          description: Attendance record restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Record is not archived - cannot restore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Grade record archive / restore ---------------------------------------
  /grades/{grade_id}/archive:
    post:
      tags: [grades, archive]
      operationId: archiveGradeRecord
      summary: Archive (soft-delete) a grade record
      description: |
        Marks the grade record as archived (`is_archived = true`).
        The record is immediately hidden from operational views and excluded
        from all `GET /assessment-forms/{id}/grades` responses unless
        `include_archived=true` is passed.

        **Allowed roles:** `teacher`, `admin`.

        **409 Conflict** is returned if the record is already archived.
        An `AuditEvent` of type `grade_record_archived` is persisted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GradeID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRecordRequest'
      responses:
        "200":
          description: Grade record archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeRecord'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Record is already archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /grades/{grade_id}/restore:
    post:
      tags: [grades, archive]
      operationId: restoreGradeRecord
      summary: Restore an archived grade record
      description: |
        Clears the archive flag (`is_archived = false`) on the grade record,
        making it visible again in operational views.

        **Allowed roles:** `teacher`, `admin`.

        **409 Conflict** is returned if the record is not archived (i.e., it is already active).
        An `AuditEvent` of type `grade_record_restored` is persisted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GradeID'
      responses:
        "200":
          description: Grade record restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeRecord'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Record is not archived - cannot restore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Reports -------------------------------------------------------------
  /reports:
