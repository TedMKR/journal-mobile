      tags: [reports]
      operationId: getReportStatus
      summary: Get the status of a report generation job
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: Report job UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTask'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /reports/{job_id}/file:
    get:
      tags: [reports]
      operationId: getReportFile
      summary: Download generated report file
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: Report job UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Generated DOCX/PDF report file
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Student Workflow ----------------------------------------------------
  # All /students/me/* endpoints are scoped to the authenticated student.
  # The student identity is derived from the Bearer token (JWT sub claim).
  # Only role: student is permitted on these endpoints.

  /students/me:
    get:
      tags: [student]
      operationId: getMyProfile
      summary: Get own student profile
      description: |
        Returns the authenticated student's display profile:
        full name, gradebook number, current group, and starosta flag.

        Returns `404` if the student's Keycloak account has not yet been linked
        to an imported student profile (first-login linking happens automatically
        on the first authenticated request via the `UserProfileSync` middleware).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /students/me/lessons:
    get:
      tags: [student]
      operationId: getMyLessons
      summary: Get personal lesson schedule with own attendance status
      description: |
        Returns all lessons from every group the authenticated student is enrolled in,
        enriched with the student's own attendance status on each lesson.

        `my_attendance_status` is `null` when no attendance record exists yet for that lesson.

        Ordered by `scheduled_at` descending (most recent first).
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: query
          required: false
          description: Filter by academic period UUID (defaults to all periods)
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          required: false
          description: Filter lessons on or after this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: Filter lessons on or before this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated lesson list with student attendance
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentLesson'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /students/me/subjects:
    get:
      tags: [student]
      operationId: getMySubjects
      summary: Get list of subjects with attendance and grade summary
      description: |
        Returns a lightweight summary for each discipline the authenticated student
        attends in the given academic period.

        Each entry includes:
        - Discipline name and teacher
        - Lessons attended vs total
        - Average grade (null if no grades yet)

        If `period_id` is not provided, returns subjects across all periods
        (active period first in ordering).
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: query
          required: false
          description: Filter by academic period UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of subjects with aggregated progress
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentSubjectSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /students/me/subjects/archive:
    get:
      tags: [student]
      operationId: getMySubjectsArchive
      summary: Get archived subject summaries from closed periods
      description: |
        Returns paginated subject summaries for the authenticated student from
        closed academic periods only (`academic_periods.is_closed = true`).

        The endpoint is intentionally separate from `/students/me/subjects`
        so mobile clients can cache and paginate archive data independently
        from the current subjects list.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of archived subject rows to return
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of archived subject rows to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated list of archived subjects with aggregated progress
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentSubjectSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /students/me/subjects/{discipline_id}/card:
    get:
      tags: [student]
      operationId: getMySubjectCard
      summary: Get full student card for one subject
      description: |
        Returns the complete aggregated view for the authenticated student
        in a specific discipline and academic period.

        Includes:
        - Student profile with `is_head_student` flag
        - Attendance counts (attended / absent / valid_excuse)
        - Grade summary (avg, assessments completed/total)
        - Monthly attendance breakdown for a progress chart

        `period_id` and `group_id` are required because the same subject can
        exist in multiple academic periods and in multiple active enrollment
        groups for one student. The client should pass both values returned by
        `GET /students/me/subjects`.
      security:
        - bearerAuth: []
      parameters:
        - name: discipline_id
          in: path
          required: true
          description: Discipline UUID
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: true
          description: Academic period UUID
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          required: true
          description: Academic group UUID from the selected subjects list row
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Full student subject card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSubjectCard'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /groups/{group_id}/head-student-grant:
    post:
      tags: [student]
      operationId: grantHeadStudentAccess
      summary: Grant starosta journal access for a group + discipline
      description: |
        Teacher or admin delegates the right for the class representative (starosta)
        to mark attendance for a specific group + discipline.

        The starosta can only mark attendance for **current and future** lessons
        (i.e. `scheduled_at >= NOW()`), unless `allows_late_entry` is explicitly set to `true`.

        The grant is upserted: if a grant already exists for this starosta + group + discipline,
        it is refreshed (revoked_at cleared, new settings applied).
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          description: Academic group UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantHeadStudentRequest'
      responses:
        "201":
          description: Grant created or refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeadStudentGrant'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /head-student-grants/{grant_id}:
    delete:
      tags: [student]
      operationId: revokeHeadStudentGrant
      summary: Revoke a starosta's journal access grant
      description: |
        Soft-revokes the grant by setting `revoked_at = NOW()`.
        After revocation, the starosta can no longer mark attendance via the delegated access.
      security:
        - bearerAuth: []
      parameters:
        - name: grant_id
          in: path
          required: true
          description: Head student grant UUID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Grant revoked
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Journal Access Grants (teacher-to-teacher delegation) -------------------
  /journal-access-grants:
    get:
      tags: [grants]
      operationId: listJournalAccessGrants
      summary: List journal access grants
      description: |
        Returns journal access grants for the authenticated teacher.

        **As grantee** (`grantee_id` = own Keycloak UUID): see journals others have shared with you.
        **As granter** (`granter_id` = own Keycloak UUID): see what access you have issued.

        Use `active_only=true` to exclude revoked and expired grants.

        **Roles:** `teacher`, `admin`
      security:
        - bearerAuth: []
      parameters:
        - name: grantee_id
          in: query
          required: false
          description: Filter by grantee Keycloak UUID (who received access)
          schema:
            type: string
        - name: granter_id
          in: query
          required: false
          description: Filter by granter Keycloak UUID (who issued the grant)
          schema:
            type: string
        - name: discipline_id
          in: query
          required: false
          description: Filter by discipline UUID
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          required: false
          description: Filter by academic group UUID
          schema:
            type: string
            format: uuid
        - name: active_only
          in: query
          required: false
          description: When true, exclude revoked and expired grants (default false)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of journal access grants
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JournalAccessGrant'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [grants]
      operationId: grantJournalAccess
      summary: Grant another teacher access to a journal
      description: |
        Creates a teacher-to-teacher journal access delegation.

        **Access levels:**
        - `read` - grantee can view lessons, attendance, and grades.
        - `write` - grantee can additionally mark attendance and submit grades.

        **Business rules:**
        - `granter_id` must be the caller's Keycloak UUID (for `teacher` role).
          `admin` may specify a different `granter_id` to issue grants on behalf of others.
        - Self-grant (`grantee_id == granter_id`) is rejected with `400`.
        - Duplicate active grant for the same scope returns `409 Conflict`.

        **Roles:** `teacher` (can only grant for their own journals), `admin`
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantJournalAccessRequest'
      responses:
        "201":
          description: Journal access grant created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/JournalAccessGrant'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /journal-access-grants/{grant_id}:
    get:
      tags: [grants]
      operationId: getJournalAccessGrant
      summary: Get a single journal access grant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JournalAccessGrantID'
      responses:
        "200":
          description: Journal access grant
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/JournalAccessGrant'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [grants]
      operationId: revokeJournalAccessGrant
      summary: Revoke a journal access grant
      description: |
        Soft-deletes the grant (`revoked_at = NOW()`).

        **Business rules:**
        - Only the **granter** or an **admin** may revoke.
        - Returns `404` if the grant is already revoked or does not exist.

        **Roles:** `teacher` (own grants only), `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JournalAccessGrantID'
      responses:
        "204":
          description: Grant revoked
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Lesson Templates (КТП) --------------------------------------------------
  /lesson-templates:
    get:
      tags: [lesson-templates]
      operationId: listLessonTemplates
      summary: List КТП templates
      description: |
        Returns all available calendar-thematic plan (КТП) templates.

        - **teacher**: see all non-archived templates for their discipline(s).
        - **methodologist / admin**: see all templates; may pass `include_deleted=true`
          to also retrieve soft-deleted (archived) templates.

        Optionally filter by `discipline_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: discipline_id
          in: query
          required: false
          description: Filter by discipline UUID
          schema:
            type: string
            format: uuid
        - name: include_deleted
          in: query
          required: false
          description: Include archived (soft-deleted) templates (methodologist/admin only)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LessonTemplate'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [lesson-templates]
      operationId: createLessonTemplate
      summary: Create a new КТП template
      description: |
        Creates a new calendar-thematic plan template for a discipline.
        Only **methodologist** and **admin** roles can create templates.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonTemplateRequest'
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTemplate'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /lesson-templates/bulk:
    post:
      tags: [lesson-templates]
      operationId: createLessonTemplateBulk
      summary: Create a КТП template with topics in one JSON request
      description: |
        Creates a calendar-thematic plan and all topics atomically.
        Frontend parses Excel/XLSX and sends this structured JSON; backend does not parse files.

        Roles: `methodologist`, `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonTemplateBulkRequest'
      responses:
        "201":
          description: Template and topics created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTemplateDetail'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /lesson-templates/{template_id}:
    get:
      tags: [lesson-templates]
      operationId: getLessonTemplate
      summary: Get a single КТП template with full topic list
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateID'
      responses:
        "200":
          description: Template detail with topics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTemplateDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [lesson-templates]
      operationId: updateLessonTemplate
      summary: Update template metadata (name / description)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonTemplateRequest'
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTemplate'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [lesson-templates]
      operationId: deleteLessonTemplate
      summary: Delete a КТП template (smart delete)
      description: |
        **Smart delete** logic:

        - If the template has **no active assignments**, it is **hard-deleted** -> `204 No Content`.
        - If the template has active assignments, it is **soft-deleted** (archived) -> `200 OK`
          with `{ "is_archived": true, "message": "..." }`.

        In both cases the template is no longer visible to teachers.
        Archived templates can be listed by methodologist/admin using `include_deleted=true`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateID'
      responses:
        "204":
          description: Template hard-deleted (had no active assignments)
        "200":
          description: Template soft-deleted / archived (had active assignments)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTemplateArchivedResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Template Topics ----------------------------------------------------------
  /lesson-templates/{template_id}/topics:
    post:
      tags: [lesson-templates]
      operationId: addLessonTemplateTopic
      summary: Add a topic to a КТП template
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTopicRequest'
      responses:
        "201":
          description: Topic added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTopic'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /lesson-templates/{template_id}/topics/reorder:
    put:
      tags: [lesson-templates]
      operationId: reorderLessonTemplateTopics
      summary: Reorder topics within a template
      description: |
        Accepts a list of `{ topic_id, order_index }` pairs and applies the new ordering
        atomically. All topic IDs that belong to the template must be included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTopicsRequest'
      responses:
        "200":
          description: Topics reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "topics reordered"
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /lesson-templates/{template_id}/topics/{topic_id}:
    put:
      tags: [lesson-templates]
      operationId: updateLessonTemplateTopic
      summary: Update a topic in a template
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateID'
        - $ref: '#/components/parameters/TopicID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopicRequest'
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTopic'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [lesson-templates]
      operationId: deleteLessonTemplateTopic
      summary: Delete a topic from a template
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateID'
        - $ref: '#/components/parameters/TopicID'
      responses:
        "204":
          description: Topic deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Template Assignments -----------------------------------------------------
  /lesson-template-assignments/current:
    get:
      tags: [lesson-templates]
      operationId: getCurrentTemplateAssignment
      summary: Get the active template assignment for a teaching context
      description: |
        Returns the currently active КТП assignment for the given
        `teacher_id` x `discipline_id` x `group_id` x `period_id` context.

        Teachers query their own assignment (server resolves `teacher_id` from the JWT).
        Methodologist/admin can pass an explicit `teacher_id` query param to inspect
        another teacher's assignment.

        Returns `404` if no active assignment exists for this context.
      security:
        - bearerAuth: []
      parameters:
        - name: discipline_id
          in: query
          required: true
          description: Discipline UUID
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          required: true
          description: Academic group UUID
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: true
          description: Academic period UUID
          schema:
            type: string
            format: uuid
        - name: teacher_id
          in: query
          required: false
          description: |
            Teacher identifier for methodologist/admin views.
            Public callers may pass the teacher Keycloak UUID; the domain resolves it
            to the internal `teacher_profiles.id` used by persisted assignments.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current template assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateAssignment'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /lesson-template-assignments:
    post:
      tags: [lesson-templates]
      operationId: assignLessonTemplate
      summary: Assign a КТП template to a teaching context
      description: |
        Links a template to a specific `discipline_id` x `group_id` x `period_id` context.
        The server automatically maps lessons in that context to template topics
        based on `order_index` and `lesson_count`.

        Returns the number of lessons updated and how many remain without a topic
        (because the template's total lesson count doesn't cover all scheduled lessons).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTemplateRequest'
      responses:
        "200":
          description: Assignment created and lessons updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignTemplateResult'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /lesson-template-assignments/{assignment_id}:
    delete:
      tags: [lesson-templates]
      operationId: revokeLessonTemplateAssignment
      summary: Revoke a template assignment
      description: |
        Soft-revokes the assignment. After revocation, the template is no longer
        considered active for that teaching context and topic hints are removed from
        affected lessons.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentID'
      responses:
        "204":
          description: Assignment revoked
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Lesson Topic Details -----------------------------------------------------
  /lessons/{lesson_id}/topic-details:
    put:
      tags: [lesson-templates]
      operationId: updateLessonTopicDetails
      summary: Update a teacher's custom topic details for a lesson
      description: |
        Allows a teacher (or methodologist / admin) to save lesson-specific topic notes.

        The result includes the original template topic (if any) alongside the custom
        teacher text and a flag indicating whether the teacher has edited the details.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LessonID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonTopicDetailsRequest'
      responses:
        "200":
          description: Topic details updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTopicInfo'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Teacher Dashboard ----------------------------------------------------
  /teacher/stats:
    get:
      tags: [dashboard]
      operationId: getTeacherStats
      summary: Get aggregate statistics for the authenticated teacher
      description: |
        Returns four summary numbers for the teacher dashboard header:
        - `total_students` - distinct students enrolled in the teacher's active groups
        - `total_disciplines` - distinct disciplines the teacher currently teaches
        - `hours_this_week` - total lesson hours scheduled for the current ISO week
          (uses `ends_at - scheduled_at`; falls back to 1.5 h per lesson if `ends_at` is null)
        - `avg_grade` - average grade across all assessment forms created by this teacher

        **Roles:** `teacher`, `methodologist`, `admin`.
        Teachers may omit `teacher_id` and always receive their own statistics.
        `methodologist` and `admin` must pass `teacher_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: teacher_id
          in: query
          required: false
          description: Target teacher profile UUID or Keycloak UUID. Required for methodologist/admin.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Teacher statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherStats'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /teacher/attendance-summary:
    get:
      tags: [dashboard]
      operationId: getAttendanceSummary
      summary: Get monthly attendance breakdown for a group + discipline
      description: |
        Returns per-month counts of present / absent / valid_excuse attendance records
        for the specified group, discipline, and period taught by the authenticated teacher.

        Frontend is expected to compute percentages from raw counts.
        `students_in_group` is the number of active enrollments for the period -
        useful as the denominator when computing group-level attendance rate.

        **Roles:** `teacher`, `methodologist`, `admin`.
        Teachers may omit `teacher_id`; `methodologist` and `admin` must pass it.
      security:
        - bearerAuth: []
      parameters:
        - name: teacher_id
          in: query
          required: false
          description: Target teacher profile UUID or Keycloak UUID. Required for methodologist/admin.
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          required: true
          description: Academic group UUID
          schema:
            type: string
            format: uuid
        - name: discipline_id
          in: query
          required: true
          description: Discipline UUID
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          description: Academic period UUID (defaults to current active period)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Monthly attendance breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSummary'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /teacher/groups-performance:
    get:
      tags: [dashboard]
      operationId: getGroupsPerformance
      summary: Get average grade per group for the authenticated teacher
      description: |
        Returns average grade value and grade count per group for a given period.
        Used for the teacher dashboard bar chart.
        Groups with no grade records are excluded from the response.

        **Roles:** `teacher`, `methodologist`, `admin`.
        Teachers may omit `teacher_id`; `methodologist` and `admin` must pass it.
        `discipline_id` can be used to inspect performance by subject.
      security:
        - bearerAuth: []
      parameters:
        - name: teacher_id
          in: query
          required: false
          description: Target teacher profile UUID or Keycloak UUID. Required for methodologist/admin.
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          description: Academic period UUID (defaults to current active period)
          schema:
            type: string
            format: uuid
        - name: discipline_id
          in: query
          required: false
          description: Optional discipline UUID for subject-scoped group performance.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Per-group average grade data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsPerformance'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /analytics/problem-students:
    get:
      tags: [dashboard]
      operationId: listProblemStudents
      summary: List students with risky grade patterns
      description: |
        Returns students whose journal grades contain a significant share of grade `2`
        or a run of consecutive grade `2` values. The endpoint is intended for
        methodologist/admin web and mobile screens.

        Defaults are conservative: at least `3` total grades are required before a
        percentage is considered, and `3` consecutive grade `2` values are always
        treated as a problem signal.

        **Roles:** `methodologist`, `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          required: false
          description: Optional student UUID filter.
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          required: false
          description: Optional academic group UUID filter.
          schema:
            type: string
            format: uuid
        - name: discipline_id
          in: query
          required: false
          description: Optional discipline UUID filter.
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          description: Optional academic period UUID filter.
          schema:
            type: string
            format: uuid
        - name: min_grades
          in: query
          required: false
          description: Minimum total grade count before percentage-based detection is applied.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 3
        - name: min_failing_grades
          in: query
          required: false
          description: Minimum consecutive grade `2` run treated as a problem signal.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 3
        - name: failing_percent_threshold
          in: query
          required: false
          description: Minimum percent of grade `2` records in the journal scope.
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 100
            default: 50
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Problem student analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemStudentsResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Archive --------------------------------------------------------------
  /journals/archive:
    get:
      tags: [archive]
      operationId: listArchivedJournals
      summary: List archived journals from closed academic periods
      description: |
        Returns a paginated list of journal entries (discipline x group x period combinations)
        from **closed** academic periods where the authenticated teacher has lessons.

        Each entry in the list can be opened as a read-only (or late-entry) journal using
        the standard `GET /lessons` + `GET /groups/{group_id}/students` + `GET /lessons/{lesson_id}/attendance`
        endpoints filtered by `discipline_id`, `group_id`, and `period_id`.

        `has_late_entries: true` indicates that at least one attendance or grade record
        in this journal was entered after the period was closed (post-session entry).
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: query
          required: false
          description: Filter by a specific closed period UUID
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of archived journals
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArchivedJournalEntry'
                  total:
                    type: integer
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Admin: Student Import ---------------------------------------------------
  #
  # Decision: Clients parse Excel/CSV and send JSON rows to the server.
  # The server validates business rules, builds a preview, detects conflicts,
  # and only writes to DB after explicit admin confirmation (POST /apply).
  #
  # Lifecycle:
  #   POST /admin/imports/students   -> batch created, preview built synchronously
  #   GET  /admin/imports            -> import batch history for diagnostics
  #   GET  /admin/imports/{id}       -> current status + preview rows
  #   GET  /admin/imports/{id}/errors -> row-level errors/warnings
  #   GET  /admin/imports/{id}/conflicts -> conflicts list (if any)
  #   POST /admin/imports/{id}/conflicts/{cid}/resolve -> resolve one conflict
  #   POST /admin/imports/{id}/apply -> finalize: write EnrollmentHistory + AuditEvent
  #   DELETE /admin/imports/{id}     -> cancel (only if not completed/applying)

  /admin/import-templates/{template_id}:
    get:
      tags: [admin-imports]
      operationId: downloadImportTemplate
      summary: Download an XLSX import template by numeric id
      description: |
        Returns a static XLSX template from the repository `docs/imports` directory.
        The backend computes the project path automatically; clients only pass a stable numeric id.

        Template ids:
        - `1` — empty student roster template
        - `2` — sample student roster template
        - `3` — empty КТП lesson template topics file
        - `4` — sample КТП lesson template topics file

        **Roles:** `admin`, `methodologist`
      security:
        - bearerAuth: []
      parameters:
        - name: template_id
          in: path
          required: true
          description: Stable numeric template id
          schema:
            type: integer
            minimum: 1
            enum: [1, 2, 3, 4]
      responses:
        "200":
          description: XLSX file
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/imports:
    get:
      tags: [admin-imports]
      operationId: listImportBatches
      summary: List import batches for diagnostics
      description: |
        Returns paginated import batch history with status, actor, affected group/period,
        summary counters, conflict count and persisted row-level error counts.

        This is the read-only diagnostics endpoint for admin/methodologist support screens.

        **Roles:** `admin`, `methodologist`
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, validating, preview_ready, conflicts_detected, resolved, applying, completed, failed, partial, cancelled]
        - name: group_id
          in: query
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          schema:
            type: string
            format: uuid
        - name: started_by
          in: query
          description: Keycloak sub claim of the user who started the import
          schema:
            type: string
        - name: import_mode
          in: query
          schema:
            type: string
            enum: [merge, replace_active_roster]
      responses:
        "200":
          description: Paginated import batch history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchHistoryListResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/imports/students:
    post:
      tags: [admin-imports]
      operationId: startStudentImport
      summary: Submit a student import batch
      description: |
        Accepts a JSON list of student rows (pre-parsed by the client from Excel/CSV).
        Synchronously validates each row and builds a **preview** of what will happen.

        **Matching priority** (finding an existing student profile):
        1. `student_code` - university-assigned ID (most reliable)
        2. `email` - if no code provided
        3. Full name + group - fallback (may produce a `name_mismatch` conflict)

        **Response status mapping:**
        - `preview_ready` - no conflicts, can call `/apply` immediately
        - `conflicts_detected` - must resolve all conflicts first, then `/apply`
        - `failed` - structural validation failed (400-level errors in rows)

        **Roles:** `admin`, `methodologist`
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStudentsRequest'
      responses:
        "202":
          description: |
            Batch created and preview built. Check `status` field:
            - `preview_ready` - ready to apply immediately
            - `conflicts_detected` - must resolve conflicts before applying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchPreview'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/imports/{batch_id}:
    get:
      tags: [admin-imports]
      operationId: getImportBatch
      summary: Get import batch status and preview
      description: |
        Returns the current status of the import batch, the summary counters,
        and the full list of preview rows (with per-row action and conflict info).

        **Roles:** `admin`
      security:
        - bearerAuth: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: Import batch UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import batch detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchPreview'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [admin-imports]
      operationId: cancelImportBatch
      summary: Cancel an import batch
      description: |
        Cancels the batch by setting `status = cancelled`.
        Only allowed when `status` is NOT `completed`, `partial`, `cancelled`, `applying`, or `failed`.

        **Roles:** `admin`
      security:
        - bearerAuth: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: Import batch UUID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Batch cancelled
        "400":
          description: Cannot cancel a completed or in-progress batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/imports/{batch_id}/conflicts:
    get:
      tags: [admin-imports]
      operationId: listImportConflicts
      summary: List conflicts for an import batch
      description: |
        Returns all conflicts detected during preview that require manual resolution.
        Each conflict has `available_resolutions` showing which decisions are valid.

        **Roles:** `admin`
      security:
        - bearerAuth: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: Import batch UUID
          schema:
            type: string
            format: uuid
        - name: resolution
          in: query
          required: false
          description: Filter by resolution status (`pending`, `skip`, `merge`, `force_move`, `force_create`, `update`)
          schema:
            type: string
      responses:
        "200":
          description: List of conflicts
          content:
            application/json:
              schema:
                type: object
                required: [batch_id, conflicts]
                properties:
                  batch_id:
                    type: string
                    format: uuid
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportConflict'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/imports/{batch_id}/errors:
    get:
      tags: [admin-imports]
      operationId: listImportBatchErrors
      summary: List row-level import errors
      description: |
        Returns persisted row-level import errors and warnings for the batch.
        Use this endpoint when the history list shows `errors_count > 0` or
        when support needs to inspect failed validation rows.

        **Roles:** `admin`, `methodologist`
      security:
        - bearerAuth: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: Import batch UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Row-level import errors and warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportItemErrorsResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/imports/{batch_id}/conflicts/{conflict_id}/resolve:
    post:
      tags: [admin-imports]
      operationId: resolveImportConflict
      summary: Resolve a specific import conflict
      description: |
        Admin provides a resolution decision for the conflict.
        Valid resolutions depend on conflict type:

        | Conflict type | Valid resolutions |
        |---|---|
        | `duplicate_in_batch` | `skip` |
        | `already_enrolled` | `skip`, `update` |
        | `already_in_other_group` | `skip`, `force_move` |
        | `name_mismatch` | `skip`, `merge` |
        | `profile_not_found` | `skip`, `force_create` |

        After all conflicts are resolved, `batch.status` automatically becomes `resolved`.

        **Roles:** `admin`
      security:
        - bearerAuth: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: Import batch UUID
          schema:
            type: string
            format: uuid
        - name: conflict_id
          in: path
          required: true
          description: Conflict UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        "200":
          description: Conflict resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportConflict'
        "400":
          description: Invalid resolution for this conflict type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Conflict already resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/imports/{batch_id}/apply:
    post:
      tags: [admin-imports]
      operationId: applyImportBatch
      summary: Apply (finalize) an import batch
      description: |
        Finalizes the import: writes `EnrollmentHistory` records, creates missing
        `StudentProfile` entries, and records an `AuditEvent`.

        **Preconditions:**
        - `batch.status` must be `preview_ready` or `resolved`
        - All conflicts must have `resolution != pending`

        Returns 409 if any conflicts are still `pending`.

        **After apply:**
        - New students (no Keycloak account yet) will be linked automatically
          when they first log in (existing profile-link middleware).
        - `batch.status` becomes `completed`, `partial`, or `failed`.

        **Roles:** `admin`
      security:
        - bearerAuth: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: Import batch UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportApplyResult'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Cannot apply - pending conflicts exist or batch already applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LessonID:
      name: lesson_id
      in: path
      required: true
      description: Lesson UUID
      schema:
        type: string
        format: uuid

    AttendanceID:
      name: attendance_id
      in: path
      required: true
      description: Attendance record UUID
      schema:
        type: string
        format: uuid

    AssessmentFormID:
      name: assessment_form_id
      in: path
      required: true
      description: Assessment form UUID
      schema:
        type: string
        format: uuid

    GradeID:
      name: grade_id
      in: path
      required: true
      description: Grade record UUID
      schema:
        type: string
        format: uuid

    JournalAccessGrantID:
      name: grant_id
      in: path
      required: true
      description: Journal access grant UUID
      schema:
        type: string
        format: uuid

    TemplateID:
      name: template_id
      in: path
      required: true
      description: КТП template UUID
      schema:
        type: string
        format: uuid

    TopicID:
      name: topic_id
      in: path
      required: true
      description: Template topic UUID
      schema:
        type: string
        format: uuid

    AssignmentID:
      name: assignment_id
      in: path
      required: true
      description: Template assignment UUID
      schema:
        type: string
        format: uuid

  schemas:
    # -- Journal Grid ------------------------------------------------------
    JournalGridResponse:
      type: object
      required: [group, discipline, academic_period, teacher, students, lessons, attendance, grades, assessment_forms, permissions, meta]
      properties:
        group:
          $ref: '#/components/schemas/JournalGridRef'
        discipline:
          $ref: '#/components/schemas/JournalGridRef'
        academic_period:
          $ref: '#/components/schemas/JournalGridAcademicPeriod'
        teacher:
          $ref: '#/components/schemas/JournalGridTeacher'
        students:
          type: array
          items:
            $ref: '#/components/schemas/JournalGridStudent'
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/JournalGridLesson'
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/JournalGridAttendance'
        grades:
          type: array
          items:
            $ref: '#/components/schemas/JournalGridGrade'
        assessment_forms:
          type: array
          items:
            $ref: '#/components/schemas/JournalGridAssessmentForm'
        permissions:
          $ref: '#/components/schemas/JournalGridPermissions'
        meta:
          $ref: '#/components/schemas/JournalGridMeta'

    JournalGridRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    JournalGridAcademicPeriod:
      type: object
      required: [id, name, starts_at, ends_at, is_closed]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_closed:
          type: boolean

    JournalGridTeacher:
      type: object
      required: [id, full_name]
      properties:
        id:
          type: string
          format: uuid
          description: Internal teacher_profiles.id
        full_name:
          type: string

    JournalGridStudent:
      type: object
      required: [student_id, full_name]
      properties:
        student_id:
          type: string
          format: uuid
          description: Internal students.id used by attendance and grade records
        full_name:
          type: string
        external_id:
          type: string
          nullable: true
        subgroup_id:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    JournalGridLesson:
      type: object
      required: [lesson_id, date, scheduled_at, lesson_type, status, updated_at]
      properties:
        lesson_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        scheduled_at:
          type: string
          format: date-time
        lesson_order_number:
          type: integer
          minimum: 1
          maximum: 8
          nullable: true
          description: Real pair number from the external schedule when available.
        topic:
          type: string
          nullable: true
        lesson_type:
          type: string
          enum: [lecture, practice, lab, seminar]
        status:
          type: string
          enum: [planned, held, cancelled, rescheduled]
        updated_at:
          type: string
          format: date-time

    JournalGridAttendance:
      type: object
      required: [attendance_id, lesson_id, student_id, status, updated_at, version]
      properties:
        attendance_id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [present, absent, valid_excuse]
        comment:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
        version:
          type: string
          format: date-time

    JournalGridAssessmentForm:
      type: object
      required: [assessment_form_id, title, type, date, updated_at]
      properties:
        assessment_form_id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
          enum: [exam, quiz, homework, project, colloquium, survey, lab_work, control_work, essay, final_grade]
        max_score:
          type: integer
          nullable: true
          description: Reserved for future scoring scales; current schema returns null.
        date:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JournalGridGrade:
      type: object
      required: [grade_id, assessment_form_id, student_id, value, updated_at, version]
      properties:
        grade_id:
          type: string
          format: uuid
        assessment_form_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        value:
          type: string
        comment:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
        version:
          type: string
          format: date-time

    JournalGridPermissions:
      type: object
      required: [can_edit_attendance, can_edit_grades, can_view_private_comments]
      properties:
        can_edit_attendance:
          type: boolean
        can_edit_grades:
          type: boolean
        can_view_private_comments:
          type: boolean

    JournalGridMeta:
      type: object
      required: [generated_at, version]
      properties:
        generated_at:
          type: string
          format: date-time
        version:
          type: string

    JournalContext:
      type: object
      required: [id, group_id, group_name, discipline_id, discipline_name,
                 teacher_id, teacher_name, period_id, period_name, lesson_type,
                 lesson_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
        discipline_id:
          type: string
          format: uuid
        discipline_name:
          type: string
        teacher_id:
          type: string
          format: uuid
        teacher_name:
          type: string
        period_id:
          type: string
          format: uuid
        period_name:
          type: string
        lesson_type:
          type: string
          enum: [lecture, practice, lab, seminar]
        plan_id:
          type: string
          format: uuid
          nullable: true
        lesson_count:
          type: integer
        created_at:
          type: string
          format: date-time

    JournalContextListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JournalContext'

    CreateJournalRequest:
      type: object
      required: [group_id, discipline_id, period_id, teacher_id, lesson_type, plan_id]
      properties:
        group_id:
          type: string
          format: uuid
        discipline_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        lesson_type:
          type: string
          enum: [lecture, practice, lab, seminar]
        plan_id:
          type: string
          format: uuid

    CreateJournalResponse:
      type: object
      required: [journal, lessons_found, lessons_created]
      properties:
        journal:
          $ref: '#/components/schemas/JournalContext'
        lessons_found:
          type: integer
        lessons_created:
          type: integer
          description: Always 0 in this endpoint; dated lessons are not synthesized.
        lessons_updated:
          type: integer
          description: Existing lessons updated with КТП topic bindings after assigning plan_id.
        lessons_without_topic:
          type: integer
          description: Existing lessons left without a КТП topic because the plan has fewer topic slots than lessons.
        assignment_id:
          type: string
          format: uuid
          nullable: true

    # -- Student Workflow ---------------------------------------------------
    StudentProfile:
      type: object
      required: [id, full_name, student_code, is_head_student]
      properties:
        id:
          type: string
          format: uuid
          description: Internal student UUID (stable FK for all relations)
        student_id:
          type: string
          format: uuid
          nullable: true
          description: Keycloak sub UUID. Null until first login link.
        full_name:
          type: string
          description: "Last First Patronymic, e.g. Иванов Иван Иванович"
          example: "Иванов Иван Иванович"
        student_code:
          type: string
          description: Gradebook number (зачётная книжка)
          example: "2023-ИТ-001"
        group_id:
          type: string
          format: uuid
          nullable: true
          description: Current group UUID (null if not enrolled)
        group_name:
          type: string
          nullable: true
          description: Current group display name
          example: "2020-ГиРО-ТИС-1б"
        is_head_student:
          type: boolean
          description: True if this student is the class representative (Starosta) in their current group

    StudentLesson:
      type: object
      required: [id, discipline_id, discipline_name, group_id, group_name, teacher_id, scheduled_at, lesson_type, status]
      description: A lesson enriched with the student's own attendance status
      properties:
        id:
          type: string
          format: uuid
        discipline_id:
          type: string
          format: uuid
        discipline_name:
          type: string
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
        teacher_id:
          type: string
          format: uuid
          description: Internal `teacher_profiles.id` of the teacher.
        teacher_name:
          type: string
          description: "Full teacher name, e.g. Петров Иван Сергеевич (empty if no profile)"
          example: "Петров Иван Сергеевич"
        period_id:
          type: string
          format: uuid
          nullable: true
        scheduled_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        lesson_order_number:
          type: integer
          minimum: 1
          maximum: 8
          nullable: true
          description: Real pair number from the external schedule when available.
        lesson_type:
          type: string
          enum: [lecture, practice, lab, seminar]
        status:
          type: string
          enum: [planned, held, cancelled, rescheduled]
        location:
          type: string
          nullable: true
          description: Classroom and building
          example: "Ауд. 301, 3-й корпус"
        topic:
          type: string
          nullable: true
        my_attendance_status:
          type: string
          enum: [present, absent, valid_excuse]
          nullable: true
          description: |
            The authenticated student's own attendance status on this lesson.
            `null` means no attendance record has been created yet.

    StudentSubjectSummary:
      type: object
      required: [discipline_id, discipline_name, teacher_name, group_id, group_name, period_id, lessons_attended, lessons_total]
      description: Lightweight subject summary for the subjects list view
      properties:
        discipline_id:
          type: string
          format: uuid
        discipline_name:
          type: string
        teacher_name:
          type: string
          description: Full teacher name
          example: "Петров Иван Сергеевич"
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
        period_id:
          type: string
          format: uuid
        lessons_attended:
          type: integer
          description: Lessons where the student was present
        lessons_total:
          type: integer
          description: Total lessons in this discipline + period
        attendance_pct:
          type: number
          format: float
          description: Attendance percentage (0-100); computed as lessons_attended/lessons_total*100
        avg_grade:
          type: number
          format: float
          nullable: true
          description: Average grade value (null if no grades yet)

    StudentSubjectCard:
      type: object
      required: [student, discipline_id, discipline_name, teacher_name, group_id, group_name, period_id,
                 lessons_attended, lessons_total, absences_total, absences_valid_excuse,
                 assessments_completed, assessments_total, attendance_by_month,
                 journal_lessons, journal_grades]
      description: Full aggregated view for a student in one subject
      properties:
        student:
          $ref: '#/components/schemas/StudentProfile'
        discipline_id:
          type: string
          format: uuid
        discipline_name:
          type: string
        teacher_name:
          type: string
          description: Full teacher name
          example: "Петров Иван Сергеевич"
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
        period_id:
          type: string
          format: uuid
        lessons_attended:
          type: integer
          description: Lessons where student was present
        lessons_total:
          type: integer
          description: Total lessons held in this discipline + period
        absences_total:
          type: integer
          description: Total absences (absent + valid_excuse combined)
        absences_valid_excuse:
          type: integer
          description: Absences with valid reason (valid_excuse subset of absences_total)
        assessments_completed:
          type: integer
          description: Number of assessment forms this student has a grade for
        assessments_total:
          type: integer
          description: Total assessment forms for this group + discipline + period
        avg_grade:
          type: number
          format: float
          nullable: true
          description: "Average grade value (1.0-5.0); null if no grades"
        attendance_by_month:
          type: array
          description: Monthly attendance breakdown for progress chart
          items:
            $ref: '#/components/schemas/StudentAttendanceMonth'
        journal_lessons:
          type: array
          description: The student's journal row across lessons in this subject and period.
          items:
            $ref: '#/components/schemas/StudentJournalLesson'
        journal_grades:
          type: array
          description: The student's journal row across assessment forms in this subject and period.
          items:
            $ref: '#/components/schemas/StudentJournalGrade'

    StudentAttendanceMonth:
      type: object
      required: [month, total_lessons, attended, absent, valid_excuse, attendance_pct]
      properties:
        month:
          type: string
          format: date
          description: First day of the month (YYYY-MM-01)
          example: "2024-09-01"
        total_lessons:
          type: integer
          description: Lessons scheduled in this month for this discipline
        attended:
          type: integer
          description: Lessons with status=present
        absent:
          type: integer
          description: Lessons with status=absent
        valid_excuse:
          type: integer
          description: Lessons with status=valid_excuse
        attendance_pct:
          type: number
          format: float
          description: "attended / total_lessons * 100; 0 if total_lessons is 0"
          example: 87.5

    StudentJournalLesson:
      type: object
      required: [lesson_id, date, scheduled_at, lesson_type]
      properties:
        lesson_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        scheduled_at:
          type: string
          format: date-time
        lesson_order_number:
          type: integer
          minimum: 1
          maximum: 8
          nullable: true
          description: Real pair number from the external schedule when available.
        lesson_type:
          type: string
          enum: [lecture, practice, lab, seminar]
        topic:
          type: string
          nullable: true
        attendance_status:
          type: string
          enum: [present, absent, valid_excuse]
          nullable: true
          description: Null means the attendance cell is empty.
        attendance_comment:
          type: string
          nullable: true
        attendance_updated_at:
          type: string
          format: date-time
          nullable: true

    StudentJournalGrade:
      type: object
      required: [assessment_form_id, title, type, date]
      properties:
        assessment_form_id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
          enum: [exam, quiz, homework, project, colloquium, survey, lab_work, control_work, essay, final_grade]
        date:
          type: string
          format: date-time
        value:
          type: string
          nullable: true
          description: Null means the grade cell is empty.
        comment:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    HeadStudentGrant:
      type: object
      required: [id, group_id, discipline_id, granted_by, head_student_id, allows_late_entry, granted_at]
      description: A teacher-issued permission for a starosta to mark attendance
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        discipline_id:
          type: string
          format: uuid
        granted_by:
          type: string
          description: Keycloak UUID of the teacher who granted access
        head_student_id:
          type: string
          format: uuid
          description: Internal students.id (not KC UUID) of the starosta
        allows_late_entry:
          type: boolean
          description: If false (default), starosta can only mark attendance for current/future lessons
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true

    GrantHeadStudentRequest:
      type: object
      required: [discipline_id, head_student_id]
      properties:
        discipline_id:
          type: string
          format: uuid
          description: Discipline for which access is granted
        head_student_id:
          type: string
          format: uuid
          description: |
            Internal `students.id` (UUID) of the starosta.
            Get this from `GET /groups/{group_id}/students` - use the `id` field.
        allows_late_entry:
          type: boolean
          default: false
          description: |
            When false (default): starosta can only mark attendance for lessons scheduled today or in the future.
            When true: starosta can also edit past records (exceptional, admin approval implied).
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry time for the grant (e.g. end of semester). Null = no expiry.

    AdminTeachingAssignment:
      type: object
      required: [id, teacher_id, discipline_id, group_id, period_id, assigned_at]
      description: Direct teacher assignment to a discipline, group and academic period.
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
          description: Internal teacher_profiles.id UUID
        discipline_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminTeachingAssignmentCreateRequest:
      type: object
      required: [teacher_id, discipline_id, group_id, period_id]
      properties:
        teacher_id:
          type: string
          format: uuid
          description: Internal teacher_profiles.id UUID
        discipline_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid

    AdminHeadStudentGrantCreateRequest:
      type: object
      required: [group_id, discipline_id, head_student_id]
      properties:
        group_id:
          type: string
          format: uuid
        discipline_id:
          type: string
          format: uuid
        head_student_id:
          type: string
          format: uuid
          description: Internal students.id UUID
        granted_by:
          type: string
          description: Optional actor/teacher Keycloak UUID; defaults to admin actor id.
        allows_late_entry:
          type: boolean
          default: false
        expires_at:
          type: string
          format: date-time
          nullable: true

    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          description: Total number of matching records (for pagination)
        limit:
          type: integer
        offset:
          type: integer

    # -- Dashboard ----------------------------------------------------------
    TeacherStats:
      type: object
      required: [total_students, total_disciplines, hours_this_week, avg_grade]
      properties:
        total_students:
          type: integer
          description: Distinct students enrolled in all groups the teacher currently teaches
        total_disciplines:
          type: integer
          description: Distinct disciplines in active (non-deleted) lessons
        hours_this_week:
          type: number
          format: float
          description: |
            Total lesson hours scheduled for the current ISO week.
            Computed from ends_at - scheduled_at; assumes 1.5 h when ends_at is null.
        avg_grade:
          type: number
          format: float
          nullable: true
          description: Average grade value across all assessment forms created by this teacher (null if no grades yet)

    AttendanceSummary:
      type: object
      required: [group_id, discipline_id, period_id, students_in_group, months]
      properties:
        group_id:
          type: string
          format: uuid
        discipline_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        students_in_group:
          type: integer
          description: Number of active enrollments for this group in the given period
        months:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceMonthEntry'

    AttendanceMonthEntry:
      type: object
      required: [month, lesson_count, present, absent, valid_excuse]
      properties:
        month:
          type: string
          format: date
          description: First day of the month (YYYY-MM-01)
          example: "2024-09-01"
        lesson_count:
          type: integer
          description: Number of lessons held in this month for the group + discipline
        present:
          type: integer
          description: Total attendance_records with status=present
        absent:
          type: integer
          description: Total attendance_records with status=absent
        valid_excuse:
          type: integer
          description: Total attendance_records with status=valid_excuse

    GroupsPerformance:
      type: object
      required: [period_id, groups]
      properties:
        period_id:
          type: string
          format: uuid
          nullable: true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupPerformanceEntry'

    GroupPerformanceEntry:
      type: object
      required: [group_id, group_name, avg_grade, grade_count]
      properties:
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
          example: "2020-ГиРО-ТИС-1б"
        avg_grade:
          type: number
          format: float
          description: Average grade value (1.0-5.0)
        grade_count:
          type: integer
          description: Total number of grade records for this group

    ProblemStudentsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProblemStudentEntry'
        meta:
          $ref: '#/components/schemas/ProblemStudentsMeta'

    ProblemStudentsMeta:
      type: object
      required: [total, limit, offset, min_grades, min_failing_grades, failing_grade_value, failing_percent_threshold]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        min_grades:
          type: integer
        min_failing_grades:
          type: integer
        failing_grade_value:
          type: integer
          example: 2
        failing_percent_threshold:
          type: number
          format: float

    ProblemStudentEntry:
      type: object
      required:
        - student_id
        - student_name
        - group_id
        - group_name
        - discipline_id
        - discipline_name
        - period_id
        - period_name
        - grade_count
        - failing_grade_count
        - failing_grade_percent
        - max_consecutive_failing_grades
        - has_consecutive_failing_problem
        - failing_grades
      properties:
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
        student_code:
          type: string
          nullable: true
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
        discipline_id:
          type: string
          format: uuid
        discipline_name:
          type: string
        period_id:
          type: string
          format: uuid
        period_name:
          type: string
        grade_count:
          type: integer
        failing_grade_count:
          type: integer
        failing_grade_percent:
          type: number
          format: float
        max_consecutive_failing_grades:
          type: integer
