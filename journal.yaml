  # -- Admin Periods --------------------------------------------------------
  /admin/periods:
    get:
      tags: [admin-periods]
      operationId: listAdminPeriods
      summary: List academic periods for administration
      description: |
        Returns academic periods for the admin UI. By default includes closed
        periods so the administrator can reopen a period for controlled late entry.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: include_closed
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of academic periods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPeriodListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [admin-periods]
      operationId: createAcademicPeriod
      summary: Create an academic period
      description: |
        Creates a new academic period for schedules, journals and imports.
        The date range must not overlap an existing academic period.

        Creates a `PERIOD_CREATED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPeriodCreateRequest'
      responses:
        "201":
          description: Created academic period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPeriod'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: Date range overlaps an existing academic period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/periods/{period_id}:
    patch:
      tags: [admin-periods]
      operationId: updateAcademicPeriod
      summary: Update an academic period
      description: |
        Updates the period name and/or date range. The resulting date range
        must be valid and must not overlap another academic period.

        Creates a `PERIOD_UPDATED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPeriodUpdateRequest'
      responses:
        "200":
          description: Updated academic period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPeriod'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Date range overlaps an existing academic period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [admin-periods]
      operationId: deleteAcademicPeriod
      summary: Delete an unused academic period
      description: |
        Deletes an academic period only when it has no dependent journal data,
        teaching assignments, template assignments, access grants, imports or
        journal contexts. Periods with data return `409 PERIOD_IN_USE`.

        Creates a `PERIOD_DELETED` audit event.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPeriodDeleteRequest'
      responses:
        "204":
          description: Academic period deleted
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Academic period has dependent data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/periods/{period_id}/close:
    post:
      tags: [admin-periods]
      operationId: closeAcademicPeriod
      summary: Close an academic period for journal writes
      description: |
        Sets `academic_periods.is_closed=true`. After this operation,
        attendance, assessment form and grade write endpoints reject regular
        writes with `422 PERIOD_CLOSED`.

        Creates a `PERIOD_CLOSED` audit event.

        **Allowed from:** open periods only.
        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPeriodActionRequest'
      responses:
        "200":
          description: Updated academic period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPeriod'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Invalid period status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/periods/{period_id}/reopen:
    post:
      tags: [admin-periods]
      operationId: reopenAcademicPeriod
      summary: Reopen a closed academic period for late entry
      description: |
        Sets `academic_periods.is_closed=false`. This is a controlled
        late-entry operation and requires a reason. Optional `reopen_until`
        is recorded in audit context; the current schema does not persist it
        as an automatic scheduler.

        Creates a `PERIOD_REOPENED` audit event.

        **Allowed from:** closed periods only.
        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPeriodActionRequest'
      responses:
        "200":
          description: Updated academic period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPeriod'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Invalid period status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Admin Audit ----------------------------------------------------------
  /admin/audit:
    get:
      tags: [admin-audit]
      operationId: listAdminAuditEvents
      summary: List admin audit events
      description: |
        Returns a paginated list of audit events. Supports filtering by actor,
        event type, entity, and time range.

        `before_state`, `after_state`, and `context` are base64-encoded JSON blobs.
        Decode with `atob()` / `Buffer.from(str, 'base64').toString()`.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          description: Event type filter (e.g. JOURNAL_LOCKED)
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
            example: JournalContext
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Start of time range (RFC3339)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of time range (RFC3339)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated list of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/audit/{audit_id}:
    get:
      tags: [admin-audit]
      operationId: getAdminAuditEvent
      summary: Get one audit event
      description: |
        Returns a single audit event by ID.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: audit_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit event object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/audit/export:
    get:
      tags: [admin-audit]
      operationId: exportAdminAuditEvents
      summary: Export admin audit events as CSV
      description: |
        Downloads a bounded CSV export of audit events and creates an
        `AUDIT_EXPORTED` audit event.

        `from` and `to` are required RFC3339 timestamps. The online export is
        limited to a 31-day window and 10000 rows; narrower filters should be
        used for larger audit tables.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          description: Event type filter (e.g. JOURNAL_LOCKED)
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
            example: JournalContext
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          description: Start of export range (RFC3339)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of export range (RFC3339)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: CSV audit export
          content:
            text/csv:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          description: Export row limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Admin Documents ------------------------------------------------------
  /admin/documents:
    get:
      tags: [admin-documents]
      operationId: listAdminDocuments
      summary: List admin document tasks
      description: |
        Returns document generation tasks visible to the system administrator.
        The MVP is backed by `document_tasks` and is intended for operational
        tracking of generated current attestation statements.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: job_type
          in: query
          schema:
            type: string
            enum: [current_attestation_statement]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, done, failed, permanently_failed]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated document task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDocumentListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/documents/current-attestation:
    post:
      tags: [admin-documents]
      operationId: createAdminCurrentAttestationDocument
      summary: Create a current attestation statement document as admin
      description: |
        Creates a current attestation statement document through the existing
        report generation pipeline. This endpoint fixes `report_type` to
        `current_attestation_statement`; `teacher_id` is required because the
        admin acts as an operational supervisor, not as the teacher.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCurrentAttestationDocumentRequest'
      responses:
        "202":
          description: Document generation task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/documents/{document_id}:
    get:
      tags: [admin-documents]
      operationId: getAdminDocument
      summary: Get one admin document task
      security:
        - bearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTask'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/documents/{document_id}/file:
    get:
      tags: [admin-documents]
      operationId: downloadAdminDocumentFile
      summary: Download a generated admin document file
      security:
        - bearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Generated document file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /admin/statement-templates:
    get:
      tags: [admin-documents]
      operationId: listAdminStatementTemplates
      summary: List available statement templates
      description: |
        Returns statement templates available for admin document creation.
        The MVP exposes the versioned DOCX current attestation template.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available statement templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementTemplateListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Academic Periods ----------------------------------------------------
  /academic-periods:
    get:
      tags: [periods]
      operationId: listAcademicPeriods
      summary: List all academic periods
      description: |
        Returns available academic periods (semesters) ordered by start date descending.
        The active (current) period is indicated by `is_active: true`.
        Clients use the returned `id` values when requesting reports or filtering the journal.

        Roles: `teacher`, `admin`, `student`, `methodologist`.
      security:
        - bearerAuth: []
      parameters:
        - name: include_closed
          in: query
          required: false
          description: Include closed periods in the response (default false)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of academic periods
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AcademicPeriod'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Methodologist Catalogs --------------------------------------------------
  /disciplines:
    get:
      tags: [catalogs]
      operationId: listDisciplines
      summary: List active disciplines for selector UI
      description: |
        Returns active, non-deleted disciplines. Methodologist/admin use this endpoint
        to build setup screens for КТП assignment and roster management.
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: query
          required: false
          description: Restrict to disciplines that have lessons or teaching assignments in the period
          schema:
            type: string
            format: uuid
        - name: teacher_id
          in: query
          required: false
          description: Restrict to disciplines taught by this internal teacher_profiles.id
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Case-insensitive search by name or code
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Discipline selector values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisciplineListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/PeriodClosed'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /teachers:
    get:
      tags: [catalogs]
      operationId: listTeachers
      summary: List teacher profiles for selector UI
      description: |
        Returns teacher profiles known to the system through profile sync.

        **Roles:** `teacher`, `methodologist`, `admin`

        Teachers use this selector when issuing `JournalAccessGrant` delegations
        to another teacher.
      security:
        - bearerAuth: []
      parameters:
        - name: discipline_id
          in: query
          required: false
          description: Restrict to teachers that have lessons or assignments for the discipline
          schema:
            type: string
            format: uuid
        - name: group_id
          in: query
          required: false
          description: Restrict to teachers that have lessons or assignments for the group
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Case-insensitive search by full name or email
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Teacher selector values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/PeriodClosed'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /groups:
    get:
      tags: [catalogs]
      operationId: listGroups
      summary: List active academic groups for selector UI
      description: Returns non-deleted academic groups, optionally scoped by teacher, discipline and period.
      security:
        - bearerAuth: []
      parameters:
        - name: discipline_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: teacher_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Case-insensitive search by group name or faculty
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Group selector values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Schedule / Lessons --------------------------------------------------
  /lessons:
    get:
      tags: [schedule]
      operationId: listLessons
      summary: List lessons for the authenticated teacher
      description: |
        Returns lessons assigned to the current teacher, filtered by group, discipline,
        and/or date range. This is the primary endpoint for building the journal grid
        (columns) and the teacher's weekly schedule view.

        **Journal grid construction:**
        - Fetch lessons for a specific `group_id` + `discipline_id` + `period_id` to get columns.
        - Fetch students separately via `GET /groups/{group_id}/students` for rows.
        - Fetch attendance per lesson via `GET /lessons/{lesson_id}/attendance` for cells.

        Results are ordered by `scheduled_at` ascending.
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: query
          required: false
          description: Filter by academic group UUID
          schema:
            type: string
            format: uuid
        - name: discipline_id
          in: query
          required: false
          description: Filter by discipline UUID
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          description: Filter by academic period UUID
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          required: false
          description: Start of date range (inclusive, YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: End of date range (inclusive, YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of lessons
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lesson'
                  total:
                    type: integer
                    description: Total number of lessons matching the filter
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Groups / Student Roster ----------------------------------------------
  /groups/{group_id}/students:
    get:
      tags: [groups]
      operationId: listGroupStudents
      summary: List students in a group
      description: |
        Returns the active student roster for a group as of the given period.
        This is the primary endpoint for building the journal grid rows.
        Methodologists use it to show the ready group roster before applying
        a `replace_active_roster` import or reusing the same group composition
        across lecture/practice/lab journal views.
        Roles: `teacher`, `admin`, `methodologist`.

        Students are ordered by last name ascending.
        When `period_id` is provided, the roster is evaluated as of the end of
        that academic period; for the current period the as-of date is today.
        When omitted, only currently active enrollments (`left_at IS NULL`) are
        returned.
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          description: Academic group UUID
          schema:
            type: string
            format: uuid
        - name: period_id
          in: query
          required: false
          description: Filter by academic period (defaults to current active period)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of students in the group
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Student'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/PeriodClosed'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /groups/{group_id}/journal:
    get:
      tags: [journal]
      operationId: getGroupJournalGrid
      summary: Get complete journal grid for a group
      description: |
        Returns a single read model for rendering the teacher journal grid:
        group, discipline, academic period, teacher, students, lessons,
        attendance records, assessment forms, grade records and edit permissions.

        Edge passes the authenticated Keycloak user id to Domain. Domain resolves it
        to `teacher_profiles.id` for teachers. Methodologist/admin callers pass
        `teacher_id` to select the target journal context.
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          description: Academic group UUID
          schema:
            type: string
            format: uuid
        - name: discipline_id
          in: query
          required: true
          description: Discipline UUID
          schema:
            type: string
            format: uuid
        - name: academic_period_id
          in: query
          required: true
          description: Academic period UUID
          schema:
            type: string
            format: uuid
        - name: teacher_id
          in: query
          required: false
          description: Target teacher UUID. Required for Methodologist/admin; teachers may omit it for their own journal.
          schema:
            type: string
            format: uuid
        - name: lesson_type
          in: query
          required: false
          description: Optional lesson type filter when the UI opens a specific journal type.
          schema:
            type: string
            enum: [lecture, practice, lab, seminar]
        - name: subgroup_id
          in: query
          required: false
          description: Optional subgroup UUID filter
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          required: false
          description: Start date inclusive. Defaults to academic period start.
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: End date inclusive. Defaults to academic period end.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Complete journal grid read model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalGridResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/PeriodClosed'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /journals:
    get:
      tags: [journal]
      operationId: listJournals
      summary: List created journal contexts
      description: |
        Returns explicit journal contexts created by `POST /journals`.
        A journal context is `teacher + discipline + group + period + lesson_type`.
        `lesson_count` counts only real dated `Lesson` rows that already exist
        for the context.

        Roles: `methodologist`, `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: period_id
          in: query
          schema: { type: string, format: uuid }
        - name: discipline_id
          in: query
          schema: { type: string, format: uuid }
        - name: group_id
          in: query
          schema: { type: string, format: uuid }
        - name: teacher_id
          in: query
          schema: { type: string, format: uuid }
        - name: lesson_type
          in: query
          schema:
            type: string
            enum: [lecture, practice, lab, seminar]
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of journal contexts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalContextListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [journal]
      operationId: createJournal
      summary: Create or complete a journal context from a КТП plan
      description: |
        Idempotently fixes the journal context and active КТП assignment for
        `teacher + discipline + group + period + lesson_type`.

        It does not create dated lessons when real dates are absent. Lessons are
        returned only after schedule sync or another real-dated lesson creation flow.

        Roles: `methodologist`, `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJournalRequest'
      responses:
        "201":
          description: Journal context with lesson creation counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJournalResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/PeriodClosed'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # -- Attendance ----------------------------------------------------------
  /lessons/{lesson_id}/attendance:
