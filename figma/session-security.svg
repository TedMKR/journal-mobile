<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" width="860" height="680"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <!-- arrow dark -->
    <marker id="ad" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#374151"/>
    </marker>
    <!-- arrow green -->
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#16A34A"/>
    </marker>
    <!-- arrow red -->
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#DC2626"/>
    </marker>
    <!-- arrow blue -->
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563EB"/>
    </marker>
    <!-- arrow orange -->
    <marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- ░░ BACKGROUND ░░ -->
  <rect width="860" height="680" fill="#F3F4F6" rx="20"/>

  <!-- TITLE -->
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">
    Безопасность сессии — жизненный цикл
  </text>
  <text x="430" y="54" text-anchor="middle" font-size="11" fill="#6B7280">
    Запуск приложения · EncryptedSharedPreferences · Биометрия · Room · Keycloak
  </text>

  <!-- ═══════════════════════════════════════════
       СТАРТ
  ═══════════════════════════════════════════ -->
  <!-- START node -->
  <rect x="340" y="72" width="180" height="48" rx="24" fill="#111827"/>
  <text x="430" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">▶  Запуск приложения</text>
  <text x="430" y="108" text-anchor="middle" font-size="10" fill="#9CA3AF">AppViewModel.checkSession()</text>

  <!-- arrow down -->
  <line x1="430" y1="120" x2="430" y2="146" stroke="#374151" stroke-width="2" marker-end="url(#ad)"/>

  <!-- ═══════════════════════════════════════════
       DECISION 1 — проверка токенов
  ═══════════════════════════════════════════ -->
  <!-- diamond -->
  <polygon points="430,148 570,188 430,228 290,188" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="430" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">Токены в</text>
  <text x="430" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">EncryptedSharedPrefs?</text>

  <!-- ── branch: НЕТ → Keycloak (right) ── -->
  <line x1="570" y1="188" x2="696" y2="188" stroke="#DC2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="622" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">НЕТ</text>

  <!-- KEYCLOAK LOGIN box (right column) -->
  <rect x="700" y="162" width="144" height="52" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="772" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Keycloak</text>
  <text x="772" y="198" text-anchor="middle" font-size="10" fill="#7F1D1D">Полный вход</text>
  <text x="772" y="210" text-anchor="middle" font-size="9"  fill="#9CA3AF">PKCE · AppAuth</text>

  <!-- ── branch: ДА → проверка срока ── -->
  <line x1="430" y1="228" x2="430" y2="254" stroke="#374151" stroke-width="2" marker-end="url(#ad)"/>
  <text x="440" y="246" font-size="10" font-weight="600" fill="#374151">ДА</text>

  <!-- ═══════════════════════════════════════════
       DECISION 2 — срок токена
  ═══════════════════════════════════════════ -->
  <polygon points="430,256 554,292 430,328 306,292" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="430" y="287" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Access token</text>
  <text x="430" y="303" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">действителен?</text>

  <!-- ── НЕТ → тихое обновление (left) ── -->
  <line x1="306" y1="292" x2="196" y2="292" stroke="#D97706" stroke-width="2" marker-end="url(#ao)"/>
  <text x="248" y="284" text-anchor="middle" font-size="10" font-weight="600" fill="#D97706">НЕТ</text>

  <!-- SILENT REFRESH box (left column) -->
  <rect x="36" y="262" width="158" height="60" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="115" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Тихое обновление</text>
  <text x="115" y="296" text-anchor="middle" font-size="10" fill="#78350F">Keycloak refresh_token</text>
  <text x="115" y="310" text-anchor="middle" font-size="9"  fill="#9CA3AF">tryRefresh(refreshToken)</text>

  <!-- from refresh: success arrow down to biometric -->
  <line x1="115" y1="322" x2="115" y2="408" stroke="#16A34A" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="88" y="366" font-size="9" font-weight="600" fill="#16A34A">Успех</text>

  <!-- from refresh: fail arrow right to Keycloak -->
  <line x1="194" y1="289" x2="700" y2="220" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="430" y="254" text-anchor="middle" font-size="9" fill="#DC2626">Ошибка обновления → очистить токены</text>

  <!-- ── ДА → биометрия ── -->
  <line x1="430" y1="328" x2="430" y2="374" stroke="#374151" stroke-width="2" marker-end="url(#ad)"/>
  <text x="440" y="356" font-size="10" font-weight="600" fill="#374151">ДА</text>

  <!-- ═══════════════════════════════════════════
       BIOMETRIC PROMPT
  ═══════════════════════════════════════════ -->
  <!-- biometric box -->
  <rect x="278" y="376" width="304" height="64" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="430" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">🔒  Биометрическая проверка</text>
  <text x="430" y="415" text-anchor="middle" font-size="10" fill="#4338CA">androidx.biometric · BiometricPrompt</text>
  <text x="430" y="430" text-anchor="middle" font-size="9"  fill="#6366F1">Отпечаток пальца / Face ID / PIN</text>

  <!-- connector left (from refresh) into biometric -->
  <line x1="115" y1="408" x2="278" y2="408" stroke="#16A34A" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- ── SUCCESS → next ── -->
  <line x1="430" y1="440" x2="430" y2="474" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>
  <text x="442" y="462" font-size="10" font-weight="600" fill="#16A34A">Успех</text>

  <!-- ── FAIL → Keycloak (right) ── -->
  <line x1="582" y1="408" x2="700" y2="340" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="656" y="372" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">Отмена / ошибка</text>

  <!-- ═══════════════════════════════════════════
       JWT DECODE
  ═══════════════════════════════════════════ -->
  <rect x="270" y="476" width="320" height="58" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="430" y="496" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">JwtUtils — декодирование токена</text>
  <text x="430" y="512" text-anchor="middle" font-size="9"  fill="#166534">extractRoles() → роль пользователя</text>
  <text x="430" y="526" text-anchor="middle" font-size="9"  fill="#166534">extractFullName() → имя для Room</text>

  <!-- arrow down -->
  <line x1="430" y1="534" x2="430" y2="558" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>

  <!-- ═══════════════════════════════════════════
       ROOM SESSION SAVE
  ═══════════════════════════════════════════ -->
  <rect x="240" y="560" width="380" height="56" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="430" y="580" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">Room — сохранение сессии</text>
  <text x="430" y="596" text-anchor="middle" font-size="9"  fill="#1E40AF">SessionRepository.saveSession(role, userId, fullName)</text>
  <text x="430" y="610" text-anchor="middle" font-size="9"  fill="#3B82F6">Таблица session · id = 1 · REPLACE on conflict</text>

  <!-- arrow down -->
  <line x1="430" y1="616" x2="430" y2="640" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>

  <!-- ═══════════════════════════════════════════
       AUTHENTICATED
  ═══════════════════════════════════════════ -->
  <rect x="298" y="642" width="264" height="28" rx="14" fill="#16A34A"/>
  <text x="430" y="661" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">✓  Аутентифицирован — переход на экран роли</text>

  <!-- ═══════════════════════════════════════════
       LOGOUT note (bottom-right)
  ═══════════════════════════════════════════ -->
  <rect x="660" y="580" width="180" height="68" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="750" y="598" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">При logout</text>
  <text x="750" y="613" text-anchor="middle" font-size="9"  fill="#7F1D1D">TokenStore.clear()</text>
  <text x="750" y="627" text-anchor="middle" font-size="9"  fill="#7F1D1D">SessionRepository.clearAll()</text>
  <text x="750" y="641" text-anchor="middle" font-size="9"  fill="#9CA3AF">Все таблицы Room очищены</text>

  <!-- Keycloak → back to start arrow (curved via top) -->
  <path d="M772,162 Q820,100 620,86" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="780" y="116" text-anchor="middle" font-size="9" fill="#DC2626">→ вход</text>

</svg>
