<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" width="860" height="760"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#6B7280"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#93C5FD"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#223268"/>
    </marker>
  </defs>

  <!-- ░░░ PAGE BACKGROUND ░░░ -->
  <rect width="860" height="760" fill="#F1F2F4" rx="18"/>

  <!-- ══════════════════════════════════════════
       TITLE
  ══════════════════════════════════════════ -->
  <text x="430" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#223268">
    Архитектура Android-клиента (многомодульный проект)
  </text>

  <!-- ══════════════════════════════════════════
       СЛОЙ 1 — app
  ══════════════════════════════════════════ -->
  <text x="22" y="70" font-size="10" fill="#9CA3AF" font-style="italic">Слой 1</text>
  <!-- Box -->
  <rect x="270" y="56" width="320" height="58" rx="14" fill="#223268"/>
  <text x="430" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">app</text>
  <text x="430" y="98" text-anchor="middle" font-size="10" fill="#A5B4FC">
    Точка входа · Hilt DI · Навигация · Биометрия · SessionState
  </text>

  <!-- connector app → features -->
  <line x1="430" y1="114" x2="430" y2="138" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ══════════════════════════════════════════
       СЛОЙ 2 — features  (grouped)
  ══════════════════════════════════════════ -->
  <text x="22" y="152" font-size="10" fill="#9CA3AF" font-style="italic">Слой 2</text>
  <!-- group container -->
  <rect x="24" y="140" width="812" height="80" rx="14" fill="#E4E6EC" stroke="#C8CDD8" stroke-width="1.2"/>
  <text x="44" y="158" font-size="10" font-weight="600" fill="#7E8E99">features</text>

  <!-- auth -->
  <rect x="36"  y="162" width="160" height="46" rx="10" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="116" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">features:auth</text>
  <text x="116" y="198" text-anchor="middle" font-size="9"  fill="#6B7280">Авторизация · Keycloak · AppAuth</text>

  <!-- teacher -->
  <rect x="212" y="162" width="180" height="46" rx="10" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="302" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">features:teacher:*</text>
  <text x="302" y="198" text-anchor="middle" font-size="9"  fill="#6B7280">Расписание · Журнал · Кабинет · Ведомости</text>

  <!-- student -->
  <rect x="408" y="162" width="170" height="46" rx="10" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="493" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">features:student</text>
  <text x="493" y="198" text-anchor="middle" font-size="9"  fill="#6B7280">Расписание · Личный кабинет</text>

  <!-- methodist -->
  <rect x="594" y="162" width="228" height="46" rx="10" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="708" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">features:methodist</text>
  <text x="708" y="198" text-anchor="middle" font-size="9"  fill="#6B7280">Журналы · КТП · Создание журнала</text>

  <!-- connector features → shared:navigation -->
  <line x1="430" y1="220" x2="430" y2="244" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ══════════════════════════════════════════
       СЛОЙ 3 — shared
  ══════════════════════════════════════════ -->
  <text x="22" y="258" font-size="10" fill="#9CA3AF" font-style="italic">Слой 3</text>
  <rect x="24" y="246" width="812" height="58" rx="14" fill="#E4E6EC" stroke="#C8CDD8" stroke-width="1.2"/>
  <text x="44" y="264" font-size="10" font-weight="600" fill="#7E8E99">shared</text>

  <rect x="290" y="258" width="280" height="34" rx="9" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="430" y="271" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">shared:navigation</text>
  <text x="430" y="284" text-anchor="middle" font-size="9"  fill="#6B7280">Routes · Маршруты всех экранов</text>

  <!-- connector shared → core -->
  <line x1="430" y1="304" x2="430" y2="328" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ══════════════════════════════════════════
       СЛОЙ 4 — core (базовые модули)
  ══════════════════════════════════════════ -->
  <text x="22" y="342" font-size="10" fill="#9CA3AF" font-style="italic">Слой 4</text>
  <rect x="24" y="330" width="812" height="90" rx="14" fill="#E4E6EC" stroke="#C8CDD8" stroke-width="1.2"/>
  <text x="44" y="348" font-size="10" font-weight="600" fill="#7E8E99">core — базовые модули</text>

  <!-- core:common -->
  <rect x="36"  y="354" width="180" height="54" rx="10" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="126" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">core:common</text>
  <text x="126" y="387" text-anchor="middle" font-size="9"  fill="#6B7280">AppConfig · TokenStore</text>
  <text x="126" y="399" text-anchor="middle" font-size="9"  fill="#6B7280">TokenSession · RoleSession · JwtUtils</text>

  <!-- core:model -->
  <rect x="232" y="354" width="170" height="54" rx="10" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="317" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">core:model</text>
  <text x="317" y="387" text-anchor="middle" font-size="9"  fill="#6B7280">Модели данных API</text>
  <text x="317" y="399" text-anchor="middle" font-size="9"  fill="#6B7280">Serializable DTO</text>

  <!-- core:network -->
  <rect x="418" y="354" width="190" height="54" rx="10" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="513" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">core:network</text>
  <text x="513" y="387" text-anchor="middle" font-size="9"  fill="#6B7280">Retrofit · OkHttp · JournalApi</text>
  <text x="513" y="399" text-anchor="middle" font-size="9"  fill="#6B7280">BearerTokenInterceptor</text>

  <!-- core:ui -->
  <rect x="624" y="354" width="196" height="54" rx="10" fill="#fff" stroke="#D3D7E1" stroke-width="1"/>
  <text x="722" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#223268">core:ui</text>
  <text x="722" y="387" text-anchor="middle" font-size="9"  fill="#6B7280">Общие Composable-компоненты</text>
  <text x="722" y="399" text-anchor="middle" font-size="9"  fill="#6B7280">Material 3 · Theme · Цвета</text>

  <!-- connector core → offline layer -->
  <line x1="250" y1="420" x2="250" y2="464" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="513" y1="420" x2="513" y2="464" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ══════════════════════════════════════════
       СЛОЙ 5 — OFFLINE (core:data + core:database)  HIGHLIGHTED
  ══════════════════════════════════════════ -->
  <text x="22" y="458" font-size="10" fill="#9CA3AF" font-style="italic">Слой 5</text>

  <!-- outer glow container -->
  <rect x="24" y="466" width="812" height="168" rx="16"
        fill="#1A3A7A" stroke="#93C5FD" stroke-width="2"/>
  <text x="44" y="486" font-size="11" font-weight="700" fill="#93C5FD">
    Offline-first слой — данные и локальная база
  </text>

  <!-- ── core:data ── -->
  <rect x="38" y="494" width="368" height="126" rx="12"
        fill="#1E4D9C" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="58" y="514" font-size="12" font-weight="700" fill="#fff">core:data</text>
  <text x="58" y="530" font-size="9" fill="#BAC8F3">Репозитории и бизнес-логика работы с данными</text>

  <!-- NetworkBoundResource -->
  <rect x="50"  y="538" width="168" height="70" rx="9" fill="#fff" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1"/>
  <text x="134" y="554" text-anchor="middle" font-size="10" font-weight="700" fill="#93C5FD">NetworkBoundResource</text>
  <text x="134" y="568" text-anchor="middle" font-size="9"  fill="#CBD5E1">1. Отдаёт кеш из Room сразу</text>
  <text x="134" y="580" text-anchor="middle" font-size="9"  fill="#CBD5E1">2. Запрашивает API в фоне</text>
  <text x="134" y="592" text-anchor="middle" font-size="9"  fill="#CBD5E1">3. Обновляет Room → обновляет UI</text>
  <text x="134" y="604" text-anchor="middle" font-size="9"  fill="#F87171">4. Сеть недоступна → кеш + ошибка</text>

  <!-- SessionRepository -->
  <rect x="234" y="538" width="160" height="70" rx="9" fill="#fff" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1"/>
  <text x="314" y="554" text-anchor="middle" font-size="10" font-weight="700" fill="#93C5FD">SessionRepository</text>
  <text x="314" y="570" text-anchor="middle" font-size="9"  fill="#CBD5E1">saveSession(role, userId)</text>
  <text x="314" y="584" text-anchor="middle" font-size="9"  fill="#CBD5E1">observeSession(): Flow</text>
  <text x="314" y="598" text-anchor="middle" font-size="9"  fill="#F87171">clearAll() при logout</text>

  <!-- arrow core:data → core:database -->
  <line x1="408" y1="556" x2="446" y2="556"
        stroke="#93C5FD" stroke-width="2" marker-end="url(#b)"/>
  <text x="427" y="546" text-anchor="middle" font-size="9" fill="#93C5FD">использует</text>

  <!-- ── core:database ── -->
  <rect x="454" y="494" width="368" height="126" rx="12"
        fill="#1E4D9C" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="474" y="514" font-size="12" font-weight="700" fill="#fff">core:database</text>
  <text x="474" y="530" font-size="9" fill="#BAC8F3">Room (SQLite) · @Database · version 1 · JournalDatabase</text>

  <!-- table: session -->
  <rect x="466"  y="538" width="106" height="70" rx="8" fill="#fff" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1"/>
  <text x="519"  y="553" text-anchor="middle" font-size="9"  font-weight="700" fill="#93C5FD">session</text>
  <text x="519"  y="566" text-anchor="middle" font-size="8.5" fill="#CBD5E1">role · userId</text>
  <text x="519"  y="578" text-anchor="middle" font-size="8.5" fill="#CBD5E1">fullName · updatedAt</text>
  <text x="519"  y="592" text-anchor="middle" font-size="8"  fill="#94A3B8">SessionDao</text>

  <!-- table: lessons -->
  <rect x="580"  y="538" width="110" height="70" rx="8" fill="#fff" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1"/>
  <text x="635"  y="553" text-anchor="middle" font-size="9"  font-weight="700" fill="#93C5FD">*_lessons</text>
  <text x="635"  y="566" text-anchor="middle" font-size="8.5" fill="#CBD5E1">teacher_lessons</text>
  <text x="635"  y="578" text-anchor="middle" font-size="8.5" fill="#CBD5E1">student_lessons</text>
  <text x="635"  y="592" text-anchor="middle" font-size="8"  fill="#94A3B8">кеш расписания</text>

  <!-- table: journal_grid_cache -->
  <rect x="698"  y="538" width="112" height="70" rx="8" fill="#fff" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1"/>
  <text x="754"  y="553" text-anchor="middle" font-size="9"  font-weight="700" fill="#93C5FD">journal_grid_cache</text>
  <text x="754"  y="566" text-anchor="middle" font-size="8.5" fill="#CBD5E1">groupId+disciplineId</text>
  <text x="754"  y="578" text-anchor="middle" font-size="8.5" fill="#CBD5E1">+periodId → JSON</text>
  <text x="754"  y="592" text-anchor="middle" font-size="8"  fill="#94A3B8">кеш журнала</text>

  <!-- ══════════════════════════════════════════
       СЛОЙ 6 — pending_actions (offline queue)
  ══════════════════════════════════════════ -->
  <!-- separator label -->
  <text x="22" y="650" font-size="10" fill="#9CA3AF" font-style="italic">Очередь</text>

  <rect x="24" y="654" width="812" height="88" rx="14"
        fill="#7F1D1D" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="44" y="673" font-size="11" font-weight="700" fill="#FCA5A5">
    pending_actions — очередь офлайн-действий (PendingActionDao)
  </text>

  <!-- action types -->
  <rect x="38"  y="681" width="125" height="50" rx="9" fill="#fff" fill-opacity="0.1" stroke="#FCA5A5" stroke-width="1"/>
  <text x="100" y="696" text-anchor="middle" font-size="9"  font-weight="700" fill="#FCA5A5">Посещаемость</text>
  <text x="100" y="710" text-anchor="middle" font-size="8.5" fill="#FECACA">MARK_ATTENDANCE</text>
  <text x="100" y="722" text-anchor="middle" font-size="8"  fill="#94A3B8">retry_count &lt; 5</text>

  <rect x="174" y="681" width="130" height="50" rx="9" fill="#fff" fill-opacity="0.1" stroke="#FCA5A5" stroke-width="1"/>
  <text x="239" y="696" text-anchor="middle" font-size="9"  font-weight="700" fill="#FCA5A5">Оценки</text>
  <text x="239" y="710" text-anchor="middle" font-size="8.5" fill="#FECACA">CREATE / UPDATE</text>
  <text x="239" y="722" text-anchor="middle" font-size="8.5" fill="#FECACA">DELETE_GRADE</text>

  <rect x="316" y="681" width="150" height="50" rx="9" fill="#fff" fill-opacity="0.1" stroke="#FCA5A5" stroke-width="1"/>
  <text x="391" y="696" text-anchor="middle" font-size="9"  font-weight="700" fill="#FCA5A5">Формы контроля</text>
  <text x="391" y="710" text-anchor="middle" font-size="8.5" fill="#FECACA">CREATE / UPDATE</text>
  <text x="391" y="722" text-anchor="middle" font-size="8.5" fill="#FECACA">DELETE_ASSESSMENT_FORM</text>

  <rect x="478" y="681" width="150" height="50" rx="9" fill="#fff" fill-opacity="0.1" stroke="#FCA5A5" stroke-width="1"/>
  <text x="553" y="696" text-anchor="middle" font-size="9"  font-weight="700" fill="#FCA5A5">Темы занятий</text>
  <text x="553" y="710" text-anchor="middle" font-size="8.5" fill="#FECACA">UPDATE_LESSON_TOPIC</text>
  <text x="553" y="722" text-anchor="middle" font-size="8.5" fill="#FECACA">payload JSON</text>

  <!-- sync icon -->
  <rect x="648" y="681" width="174" height="50" rx="9" fill="#fff" fill-opacity="0.08" stroke="#FCA5A5" stroke-width="1"/>
  <text x="735" y="696" text-anchor="middle" font-size="9"  font-weight="700" fill="#FCA5A5">Синхронизация</text>
  <text x="735" y="710" text-anchor="middle" font-size="8.5" fill="#FECACA">При появлении сети →</text>
  <text x="735" y="722" text-anchor="middle" font-size="8.5" fill="#FECACA">отправляем очередь на API</text>

  <!-- connector offline queue → core:database (upward) -->
  <line x1="638" y1="654" x2="638" y2="634"
        stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#b)"/>

</svg>
